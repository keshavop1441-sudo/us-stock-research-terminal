name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: |
          ruff check app tests scripts claude
          ruff format --check app tests scripts claude
      - name: Tests
        run: python -m pytest -q

  lock-freshness:
    name: lock files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Recompile locks and require no change
        run: |
          uv pip compile requirements.txt --universal --python-version 3.14 --generate-hashes -o requirements.lock
          uv pip compile requirements-dev.txt --universal --python-version 3.14 --generate-hashes -o requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock

  minimal-environment:
    name: DuckDB->Polars conversion with only duckdb + polars installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ONLY duckdb and polars (pinned as in requirements.txt)
        run: |
          python -m venv /tmp/minimal
          /tmp/minimal/bin/python -m pip install $(grep -E '^(duckdb|polars)==' requirements.txt | cut -d' ' -f1)
          /tmp/minimal/bin/python -m pip list
      - name: Run the standalone conversion check
        run: /tmp/minimal/bin/python tests/minimal_frames_check.py

  skill-package:
    name: Skill package builds, is reproducible and runs (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the Skill ZIP (standard library only) and verify it is reproducible
        run: |
          python scripts/package_skill.py
          python scripts/package_skill.py --verify
      - name: Install RUNTIME dependencies only (what the packaged Skill needs)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run the packaged Skill from an unpacked copy (no repository around it)
        shell: python
        run: |
          import subprocess, sys, tempfile, zipfile, pathlib
          target = pathlib.Path(tempfile.mkdtemp())
          zipfile.ZipFile("dist/us-stock-research.zip").extractall(target)
          launcher = target / "us-stock-research" / "scripts" / "research.py"
          work = target / "work"
          work.mkdir()
          for args in (["catalog"], ["doctor"]):
              done = subprocess.run([sys.executable, str(launcher), *args], cwd=work, capture_output=True, text=True)
              print(done.stdout[:400])
              assert done.returncode == 0, done.stderr
      - name: Run research.py doctor from the source checkout
        run: python claude/skills/us-stock-research/scripts/research.py doctor
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: us-stock-research-skill
          path: |
            dist/us-stock-research.zip
            dist/us-stock-research.zip.sha256
