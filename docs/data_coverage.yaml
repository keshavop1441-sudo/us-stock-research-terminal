# Phase 2 data-source and metric coverage matrix. MACHINE-READABLE; validated by tests/test_data_coverage.py.
# Human summary: docs/data_coverage.md. Executable rules: app/screening/metrics.py (tests/test_metrics.py).
#
# Controlled `status` values (one per metric entry):
#   LIVE_VERIFIED      a live call from a GitHub-hosted runner returned this data (evidence ids + symbols in sample_tested)
#   API_SHAPE_VERIFIED the installed provider code / `obb.reference` defines it, but no live sample was retrieved
#   FIXTURE_VERIFIED   verified only against a recorded real response (upstream OpenBB cassette) at its recorded date
#   NOT_VERIFIED       believed possible, not tested; treat as unknown
#   UNAVAILABLE        no suitable source among the installed providers / free public endpoints
#   DERIVED            computed locally from other metric entries (`inputs`); the rule is in `formula`, and where a
#                      function exists `rule_function` names it in app.screening.metrics
#
# Honesty note: the development sandbox could not reach any provider (network policy). Every LIVE_VERIFIED claim comes from
# the read-only probe (scripts/audit/probe_providers.py) running on GitHub Actions, evidence ids E_LIVE_*. Nothing was
# verified on Windows or against a paid/keyed provider (none of the four installed providers needs a key).

schema_version: 1
audit_date: "2026-10-02"
audit_scope: "Phase 2 audit only: nothing here is a production ingestion pipeline."

statuses: [LIVE_VERIFIED, API_SHAPE_VERIFIED, FIXTURE_VERIFIED, NOT_VERIFIED, UNAVAILABLE, DERIVED]

required_metric_fields:
  - metric
  - category
  - canonical_definition
  - source
  - provider
  - command
  - identifier
  - period
  - direct_or_derived
  - inputs
  - formula
  - missing_data_behavior
  - negative_data_behavior
  - restatement_behavior
  - status
  - fallback
  - limitations
  - sample_tested

