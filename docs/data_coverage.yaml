environment:
  openbb_version: "openbb-core 2.0.1 (V5); extensions sec/nasdaq/cboe/news 2.0.0"
  credentials_required: false
  sec_user_agent: "SEC fair-access policy requires a contact in the User-Agent. OpenBB ships a placeholder UA that worked in the audit; production use needs a real contact configured by the operator (not set in this repository). A UA without an email-shaped contact got HTTP 403 (E_LIVE_R1)."
  sec_rate_limit: "SEC documents 10 requests/second; OpenBB defaults OPENBB_SEC_REQUESTS_PER_SECOND to 9. Not stress-tested."
  nasdaq_cboe_rate_limits: "Undocumented unofficial endpoints (api.nasdaq.com, cdn.cboe.com). No throttling seen at audit volume (about 70 calls per group). NOT verified at universe scale; both can change or block without notice."

# ---------------------------------------------------------------------------------------------------------------------
# Identity model (domain A)
# ---------------------------------------------------------------------------------------------------------------------
identity_model:
  issuer: "Keyed by CIK (10-digit text via app.models.identifiers.normalize_cik). Issuer-level facts (financial statements, filings, ownership of the issuer, events) key on cik."
  security: "A listed security (one ticker on one listing) keyed by securities.security_id; one issuer has many securities (GOOGL/GOOG/GOOGM/GOOGN under CIK 0001652044; BRK-A/BRK-B under 0001067983). Prices and quotes key on security_id."
  internal_ticker_spelling: "SEC spelling with '-' for the class suffix (BRK-B). Nasdaq and Cboe accept BRK.B; Nasdaq BRK/B returned EmptyDataError and Cboe BRK-B returned HTTP 403 (E_LIVE_R2). Implemented in app/models/symbols.py; only single-letter class suffixes are rewritten, preferred/unit/warrant conventions are NOT_VERIFIED and pass through unchanged."
  ticker_vs_cik: "A ticker is a lookup key that can be re-used, renamed or retired; the CIK is the stable key. obb.sec.cik_map(BRK-B) = 0001067983 and obb.sec.symbol_map(1067983) = BRK-B (E_LIVE_R3)."
  ticker_changes_and_history: "UNAVAILABLE as a dated history. SEC submissions give the current tickers plus formerNames (name history with dates, e.g. Facebook Inc until 2021-10-27 for META) but no former tickers. company_tickers_exchange.json is a current snapshot only (FB, TWTR, ATVI absent). Ticker history must be built by this project from dated snapshots of that file, forward from first ingestion; pre-ingestion history is not obtainable from the installed providers."
  discontinued_issuers: "Resolved by CIK: submissions for TWTR (0001418091) and ATVI (0000718877) still return filings (TWTR last filing 2022-12-02) with an empty ticker list. They are absent from company_tickers. Their prices are not available from Nasdaq/Cboe (Nasdaq profile TWTR: EmptyDataError)."
  mergers_and_name_changes: "A name change keeps the CIK (META). A pre-holding-company registrant has a different CIK (Google Inc. 0001288776 vs Alphabet 0001652044); successor linkage is NOT in the providers and would have to be curated."
  similar_tickers: "Search is by name/prefix and returns look-alikes (obb.sec.equity_search('BRK') returned BRK-B plus RBRK and BRKR; nasdaq search 'META' returned 35 rows). Resolution must be exact-match on canonical symbol or on CIK, never a prefix search."
  non_class_tickers_under_one_cik: "SEC lists GOOGM and GOOGN under Alphabet's CIK alongside GOOGL/GOOG: not every ticker under a CIK is a share class. Class labels come from the security name in the Nasdaq symbol directory ('Alphabet Inc. - Class C Capital Stock')."
  evidence: [E_LIVE_R2, E_LIVE_R3, E_FIXTURE_LIVE]

# ---------------------------------------------------------------------------------------------------------------------
# Metric dictionary (canonical source of truth for the future screener). One entry per metric/dataset.
# ---------------------------------------------------------------------------------------------------------------------
_text:
  sec_vintage: &sec_vintage "SEC companyfacts keeps every filed vintage of a fact (accn, filed, form, fy, fp); a period appears in several filings (RIVN FY2024 NetIncomeLoss is in both the FY2024 and FY2025 10-Ks, same value) and occasionally with different values (KOSS 2017-Q3 revenue). OpenBB returns one wide row per period built from the latest vintage (pit_mode=false) or the as-first-filed one (pit_mode=true) and exposes NO accession or filing date per row. Ingest raw companyfacts points (accn+filed+form) and choose the vintage at query time with latest_known(as_of); never overwrite an older vintage."
  price_basis: &price_basis "Closes are split-adjusted and NOT dividend-adjusted: Cboe and Nasdaq were identical on shared dates for MSFT and KO (E_FIXTURE_LIVE). A later split re-bases the whole provider history, so a refresh must compare overlapping rows and reload the full history when the ratio is not 1."
  no_restatement_market: &no_restate_market "Market data has no filing vintages. History is re-based by splits only; dividends do not change stored closes."
  tz_note: &tz_note "Dates are exchange-local trading dates as ISO strings; timestamps are naive. Nasdaq last_timestamp 2026-10-01T00:00:00 is a date, not an instant."

metrics:
  # ------------------------------------------------------------------------------------------------ A. identity
  - metric: issuer_cik
    category: identity
    canonical_definition: "The SEC Central Index Key of the issuer, 10-digit zero-padded text."
    source: "SEC EDGAR"
    provider: sec
    command: "obb.sec.cik_map(symbol)"
    identifier: "ticker (SEC spelling) -> cik"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Unknown ticker raises OpenBBError ('not found in SEC database'): treat as NULL cik and keep the row unresolved; never guess from a name."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot of the current ticker map; a retired ticker (TWTR, ATVI, FB) is not found."
    status: LIVE_VERIFIED
    fallback: "SEC company_tickers_exchange.json (HTTP GET https://www.sec.gov/files/company_tickers_exchange.json): 10,434 rows, 4 fields (cik, name, ticker, exchange)."
    limitations: "Result is a single object, not a list. 'BRKB' and 'TWTR' fail; 'BRK.B' not tested on this command (NOT_VERIFIED). Nasdaq's company profile returns cik NULL, so Nasdaq data can only be joined to SEC by ticker."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3], symbols: [AAPL, BRK-B]}

  - metric: ticker_to_cik_universe_map
    category: identity
    canonical_definition: "All current ticker -> (cik, name, exchange) pairs, used to seed the securities table."
    source: "SEC EDGAR"
    provider: sec
    command: "HTTP GET https://www.sec.gov/files/company_tickers_exchange.json"
    identifier: "ticker -> cik"
    period: "snapshot (current)"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "exchange can be null (170 of 10,434 rows); keep NULL."
    negative_data_behavior: "n/a"
    restatement_behavior: "Replaced wholesale on SEC's side; store each retrieval (sources) so ticker history can be reconstructed going forward."
    status: LIVE_VERIFIED
    fallback: "https://www.sec.gov/files/company_tickers.json (no exchange) or nasdaqtrader symbol directory for Nasdaq/other-listed names."
    limitations: "Exchange mix: Nasdaq 4376, NYSE 3299, OTC 2545, CBOE 44, null 170. Contains ETFs and OTC names: security type must come from a second source. Needs the SEC User-Agent contact."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_OPENBB], symbols: [AAPL, GOOGL, GOOG, BRK-B, META, NVDA, RIVN, PTON, COST, KOSS]}

  - metric: cik_to_ticker
    category: identity
    canonical_definition: "Current ticker(s) of an issuer."
    source: "SEC EDGAR"
    provider: sec
    command: "obb.sec.symbol_map(query)"
    identifier: "cik -> ticker"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Returns one symbol only; an issuer with several classes needs submissions.tickers or the universe map instead."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "submissions JSON 'tickers' array: HTTP GET https://data.sec.gov/submissions/CIK##########.json (GOOGL lists GOOGL, GOOG, GOOGM, GOOGN)."
    limitations: "symbol_map(1067983) returned BRK-B only, not BRK-A."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_LIVE_R2], symbols: [AAPL, BRK-B, GOOGL]}

  - metric: issuer_name_and_former_names
    category: identity
    canonical_definition: "Current registrant name and its dated former names."
    source: "SEC EDGAR submissions"
    provider: sec
    command: "HTTP GET https://data.sec.gov/submissions/CIK##########.json (fields name, formerNames[name,from,to])"
    identifier: cik
    period: "snapshot with dated history of names"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "formerNames may be empty."
    negative_data_behavior: "n/a"
    restatement_behavior: "Replaced on each fetch."
    status: LIVE_VERIFIED
    fallback: "Nasdaq profile name (no CIK) as a display-name fallback."
    limitations: "Names are not tickers: META shows Facebook Inc to 2021-10-27 but no ticker FB. TWTR's formerNames covers 2007-2010 only."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_OPENBB], symbols: [META, TWTR, AAPL]}

  - metric: exchange_listing
    category: identity
    canonical_definition: "Primary exchange of a listed security."
    source: "SEC company_tickers_exchange; Nasdaq quote"
    provider: sec
    command: "HTTP GET https://www.sec.gov/files/company_tickers_exchange.json (exchange); obb.nasdaq.equity.quote (exchange)"
    identifier: ticker
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL when absent."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "nasdaqtrader symbol directory (nasdaqlisted: 5640 rows incl. Market Category Q/S, ETF flag, Test Issue)."
    limitations: "Vocabularies differ ('Nasdaq' vs 'NASDAQ-GS' vs 'NYSE'); keep the raw value and map in one place."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, BRK-B, KOSS]}

  - metric: security_type
    category: identity
    canonical_definition: "Common stock vs ETF vs other instrument for a listed ticker."
    source: "nasdaqtrader symbol directory"
    provider: nasdaqtrader
    command: "HTTP GET https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt (columns Symbol, Security Name, Market Category, Test Issue, Financial Status, Round Lot Size, ETF)"
    identifier: ticker
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Tickers not in the directory (NYSE-listed) have NULL type until the other-listed file is added."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "Nasdaq profile stock_type ('Common Stock' for AAPL); SEC lists no instrument type."
    limitations: "Only the nasdaqlisted file was probed (5640 rows); the NYSE/other-listed file was NOT verified. ADR/preferred/warrant/unit detection from names is not verified. No structured share-class attribute exists."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, GOOG, GOOGL, META, NVDA, KOSS, COST]}

  - metric: sic_code_and_description
    category: identity
    canonical_definition: "SEC Standard Industrial Classification code and description of the issuer."
    source: "SEC EDGAR submissions"
    provider: sec
    command: "HTTP GET https://data.sec.gov/submissions/CIK##########.json (sic, sicDescription)"
    identifier: cik
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot; SIC can be reassigned."
    status: LIVE_VERIFIED
    fallback: "obb.sec.sic_search for the code table."
    limitations: "SIC is coarse (AAPL 3571 Electronic Computers, GOOGL 7370, BRK 6331). It is not GICS."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AMD, AVGO, RIVN, PTON, COST, KOSS, BRK-B]}

  - metric: sector_industry_vendor
    category: identity
    canonical_definition: "Vendor-assigned sector and industry labels."
    source: "Nasdaq"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol) (sector, industry); obb.nasdaq.equity.screener"
    identifier: ticker
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Returned as the string 'N/A', not null (BRK.B): normalise 'N/A' to NULL on ingest."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "sic_code_and_description."
    limitations: "Nasdaq's own taxonomy (AAPL 'Technology / Computer Manufacturing'), not GICS/ICB. GICS is UNAVAILABLE from the installed providers."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3], symbols: [AAPL, GOOGL, GOOG, BRK.B, BRK.A]}

  - metric: fiscal_year_end
    category: identity
    canonical_definition: "Nominal fiscal year end month/day of the issuer."
    source: "SEC EDGAR submissions"
    provider: sec
    command: "HTTP GET https://data.sec.gov/submissions/CIK##########.json (fiscalYearEnd as MMDD)"
    identifier: cik
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: "app.models.periods.parse_fiscal_year_end('0926') -> (9, 26)"
    missing_data_behavior: "NULL."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot; changes when a company changes fiscal year (transition period filed as 10-KT)."
    status: LIVE_VERIFIED
    fallback: "Derive from the period_end dates of ingested 10-K facts."
    limitations: "Nominal only: AAPL '0926' but actual year ends vary (2025-09-27, 2024-09-28; 52/53-week). Non-calendar examples seen: AAPL 0926, MSFT 0630, NVDA 0131, AVGO 1101, COST 0830, PTON 0630, KOSS 0630, AMD 1226."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE], symbols: [AAPL, MSFT, NVDA, AVGO, COST, PTON, KOSS, AMD]}

  - metric: share_class
    category: identity
    canonical_definition: "Which class a listed ticker represents for a multi-class issuer."
    source: "derived"
    provider: derived
    command: "derived from SEC submissions tickers[] + nasdaqtrader Security Name"
    identifier: "cik + ticker"
    period: "snapshot"
    direct_or_derived: derived
    inputs: [ticker_to_cik_universe_map, security_type]
    formula: "class label = text after ' - ' in the Security Name ('Class C Capital Stock'); issuer has >1 listed ticker under one CIK."
    missing_data_behavior: "NULL when the name carries no class text."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: DERIVED
    fallback: "Curated mapping for the few dozen dual-class issuers if names prove unreliable."
    limitations: "No provider returns a class attribute. GOOGM/GOOGN under GOOGL's CIK are not share classes. META's Nasdaq name says 'Class A Common Stock' although META has a single traded class. Not verified beyond the sample."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [GOOGL, GOOG, META, BRK-B]}

  - metric: ticker_history
    category: identity
    canonical_definition: "Dated history of which ticker an issuer used."
    source: "none"
    provider: none
    command: "none"
    identifier: cik
    period: "history"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Unavailable: do not infer a rename from a name change."
    negative_data_behavior: "n/a"
    restatement_behavior: "n/a"
    status: UNAVAILABLE
    fallback: "Snapshot company_tickers_exchange.json on every refresh and record changes in this project's own table going forward."
    limitations: "Pre-ingestion ticker history (FB->META 2022-06-09) is not in any installed provider; submissions has formerNames only."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [META, TWTR, ATVI]}

  - metric: listing_status
    category: identity
    canonical_definition: "Whether an issuer currently has a listed ticker."
    source: "derived"
    provider: derived
    command: "derived: ticker present in company_tickers_exchange / submissions.tickers non-empty"
    identifier: cik
    period: "snapshot"
    direct_or_derived: derived
    inputs: [ticker_to_cik_universe_map]
    formula: "active = cik appears in the current company_tickers_exchange map; inactive = known CIK absent from it (empty submissions.tickers)."
    missing_data_behavior: "Unknown CIK -> NULL."
    negative_data_behavior: "n/a"
    restatement_behavior: "Recomputed per refresh."
    status: DERIVED
    fallback: "Nasdaq quote returning EmptyDataError as a secondary signal."
    limitations: "Delisting date and reason are UNAVAILABLE. Absence from the map can also mean a temporary SEC lag."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [TWTR, ATVI, GOOGL]}

  # ------------------------------------------------------------------------------------------------ B. price / market
  - metric: price_daily_ohlcv
    category: market
    canonical_definition: "Daily open, high, low, close, volume per trading date, split-adjusted, not dividend-adjusted."
    source: "Cboe delayed data"
    provider: cboe
    command: "obb.cboe.equity.historical(symbol)"
    identifier: "ticker (Cboe spelling: BRK.B)"
    period: "daily; ISO date string; since listing or 2004-01-02"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Two gaps over 4 days in AAPL's history (2006-12-29 to 2007-01-03 and 2012-10-26 to 2012-10-31) coincide with known market closures (not independently verified): store what is returned, never fill. Options volume columns are mostly null."
    negative_data_behavior: "n/a"
    restatement_behavior: *price_basis
    status: LIVE_VERIFIED
    fallback: "obb.nasdaq.equity.historical(symbol): same split-adjusted convention, only about 10 years deep (AAPL from 2016-10-03), narrow date windows returned EmptyDataError so pull the full range and slice client-side. Cboe quote for the dash spelling BRK-B returned HTTP 403 (history not tested with it)."
    limitations: "Unofficial CDN endpoint, no SLA. Adjusted close equal to close: PriceRecord.adj_close must stay NULL (it would be a lie if filled with the split-adjusted close). Verified splits: AAPL 2020, AMZN 2022, GOOGL 2022, NVDA 2024 (Cboe and Nasdaq agree on pre-split rows)."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_OPENBB, E_FIXTURE_LIVE], symbols: [AAPL, AMZN, GOOGL, NVDA, MSFT, KO, RIVN]}

  - metric: price_current_delayed
    category: market
    canonical_definition: "Latest delayed quote: last price, previous close, day range, volume."
    source: "Nasdaq / Cboe"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol); obb.cboe.equity.quote(symbol)"
    identifier: "ticker (BRK.B)"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Nasdaq returns open/bid/ask null outside hours; Cboe supplies open, iv30 and its own last_timestamp (2026-10-01T15:59:59). Nasdaq last_timestamp is a date at midnight."
    negative_data_behavior: "n/a"
    restatement_behavior: *no_restate_market
    status: LIVE_VERIFIED
    fallback: "Cboe quote for price/range; last close from price_daily_ohlcv."
    limitations: "Delayed, not live, and never shown as live. The two providers disagreed on AAPL's last price (Nasdaq 330.32, Cboe 330.78) when queried together after the close; the cause (regular close vs after-hours print) was not verified. Market state from obb.nasdaq.markets.status."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, NVDA, RIVN, BRK.B]}

  - metric: market_calendar
    category: market
    canonical_definition: "Whether the US market is open, previous and next trading dates, session times."
    source: "Nasdaq"
    provider: nasdaq
    command: "obb.nasdaq.markets.status()"
    identifier: "market"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "n/a"
    negative_data_behavior: "n/a"
    restatement_behavior: "n/a"
    status: LIVE_VERIFIED
    fallback: "Derive trading days from the dates present in price_daily_ohlcv."
    limitations: "Only the current and adjacent trading day; no historical holiday calendar. Times are exchange-local (US Eastern) without an offset: see tz_note."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: []}

  - metric: week52_high_low
    category: market
    canonical_definition: "Highest high and lowest low over the 365 calendar days ending on the as-of date (intraday), plus close-based variants. Never stored; always computed from price_daily_ohlcv."
    source: "derived from daily history; Nasdaq quote year_high/year_low as cross-check"
    provider: derived
    command: "derived; cross-check obb.nasdaq.equity.quote (year_high, year_low)"
    identifier: security_id
    period: "365 calendar days ending as_of (inclusive)"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv]
    formula: "high_52w = max(high), low_52w = min(low) over rows with as_of-365d <= date <= as_of; also high_52w_close / low_52w_close."
    missing_data_behavior: "Fewer than 20 rows -> MISSING_INPUT (INSUFFICIENT_HISTORY); fewer than 240 rows -> OK with PARTIAL_WINDOW flag (recent IPO)."
    negative_data_behavior: "n/a"
    restatement_behavior: "Recomputed on any history re-base (split)."
    status: DERIVED
    fallback: "Nasdaq quote year_high/year_low (current only, not point-in-time)."
    limitations: "My intraday computation equalled Nasdaq's published year high and low exactly for AAPL, NVDA, MSFT (E_LIVE_R2), so Nasdaq uses the intraday convention; the close-based number is lower (AAPL 341.07 vs 345.34)."
    rule_function: high_low_52w
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE, E_UNIT], symbols: [AAPL, NVDA, MSFT]}

  - metric: price_return
    category: market
    canonical_definition: "Price return (no dividends) over 1D, 1W, 1M, 3M, 6M, 1Y, 3Y, 5Y: last close on/before as_of divided by last close on/before the calendar-anchored start, minus 1."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: security_id
    period: "1D=1 day, 1W=7 days, 1M=1 calendar month, 3M, 6M, 1Y=12 months, 3Y, 5Y; anchors month-end clamped"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv]
    formula: "lookback_return(closes, as_of, days|months|years) = close(as_of)/close(anchor) - 1; anchor = anchor_date(as_of, ...)."
    missing_data_behavior: "Series starts after the anchor (recent IPO: RIVN has no 5Y) -> MISSING_INPUT INSUFFICIENT_HISTORY; base close more than 7 days before the anchor -> MISSING_INPUT BASE_PRICE_STALE. Never substitute a shorter horizon."
    negative_data_behavior: "Base price <= 0 -> MISSING_INPUT."
    restatement_behavior: "Recomputed after a split re-base; flagged PRICE_RETURN_EXCLUDES_DIVIDENDS."
    status: DERIVED
    fallback: "none needed"
    limitations: "Dividend-excluded: a high-yield stock's total return is understated. Nasdaq history is only 10 years deep, so 5Y works but 10Y needs Cboe."
    rule_function: lookback_return
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [RIVN]}

  - metric: drawdown_from_52w_high
    category: market
    canonical_definition: "Latest close divided by the 52-week high, minus 1 (zero or negative)."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: security_id
    period: "as_of"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv, week52_high_low]
    formula: "close / high_52w - 1, using the intraday 52-week high and the same-day close."
    missing_data_behavior: "Missing close or high -> MISSING_INPUT."
    negative_data_behavior: "close above its own window high -> NOT_MEANINGFUL (CLOSE_ABOVE_HIGH): the data is inconsistent."
    restatement_behavior: "Recomputed after split re-base."
    status: DERIVED
    fallback: "none"
    limitations: "Uses the intraday high, so drawdown is slightly larger than a close-to-close drawdown."
    rule_function: drawdown_from_high
    sample_tested: {live: true, evidence: [E_UNIT, E_LIVE_R2], symbols: [AAPL, NVDA, MSFT]}

  - metric: benchmark_return
    category: market
    canonical_definition: "Price return of a market benchmark over the same horizons, used for relative return."
    source: "Cboe"
    provider: cboe
    command: "obb.cboe.equity.historical(SPY|QQQ|XLK) ; obb.cboe.index.historical(SPX) ; obb.nasdaq.index.historical(COMP)"
    identifier: "benchmark symbol"
    period: "daily"
    direct_or_derived: direct
    inputs: []
    formula: "price_return applied to the benchmark series."
    missing_data_behavior: "Index series carry close only (open/high/low/volume all null for SPX)."
    negative_data_behavior: "n/a"
    restatement_behavior: *price_basis
    status: LIVE_VERIFIED
    fallback: "Nasdaq index history for COMP/NDX; ETF proxies via Nasdaq equity history."
    limitations: "ETFs are price-only here (no distributions), consistent with stock price returns. Index total-return series are UNAVAILABLE."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [SPY, QQQ, XLK, SPX, COMP]}

  - metric: relative_return_vs_benchmark
    category: market
    canonical_definition: "Stock price return minus benchmark price return over the same horizon (arithmetic excess return)."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "security_id + benchmark"
    period: "as price_return"
    direct_or_derived: derived
    inputs: [price_return, benchmark_return]
    formula: "price_return(stock) - price_return(benchmark); both must be OK for the same as_of and horizon."
    missing_data_behavior: "Either side non-OK -> same state, no partial value."
    negative_data_behavior: "n/a"
    restatement_behavior: "Recomputed with inputs."
    status: DERIVED
    fallback: "n/a"
    limitations: "Excess return is not alpha. The benchmark choice is a product decision."
    sample_tested: {live: false, evidence: [E_UNIT], symbols: []}

  - metric: sector_relative_return
    category: market
    canonical_definition: "Stock return minus the return of its sector ETF."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "security_id + sector ETF"
    period: "as price_return"
    direct_or_derived: derived
    inputs: [price_return, benchmark_return, sector_industry_vendor]
    formula: "price_return(stock) - price_return(sector ETF)."
    missing_data_behavior: "No sector (BRK) or no mapped ETF -> MISSING_INPUT."
    negative_data_behavior: "n/a"
    restatement_behavior: "Recomputed."
    status: NOT_VERIFIED
    fallback: "Compare with the broad benchmark only."
    limitations: "ETF history works (XLK live) but the Nasdaq-sector -> sector-ETF mapping was not defined or tested; Nasdaq sectors are not GICS so the ETF families do not align one to one."
    sample_tested: {live: false, evidence: [E_LIVE_R2], symbols: [XLK]}

  - metric: shares_outstanding
    category: market
    canonical_definition: "Shares outstanding of the issuer as reported on the cover of its latest periodic filing, with report date."
    source: "SEC XBRL dei"
    provider: sec
    command: "HTTP GET https://data.sec.gov/api/xbrl/companyfacts/CIK##########.json (dei:EntityCommonStockSharesOutstanding: val, end, filed, accn, form)"
    identifier: cik
    period: "instant (cover-page date, about 2 weeks after quarter end)"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Multi-class issuers: GOOGL and META have NO EntityCommonStockSharesOutstanding concept (only EntityPublicFloat); BRK-B's last point is from 2011. Return NULL; never sum or guess."
    negative_data_behavior: "n/a"
    restatement_behavior: "One point per filing (accn, filed); latest_known(as_of) selects."
    status: LIVE_VERIFIED
    fallback: "Implied shares = Nasdaq market_cap / last_price (all classes at that class's price). Do NOT use OpenBB's TTM weighted_ave_diluted_shares_os: it is about 4x the real count (AAPL TTM 59.1B vs 14.6B outstanding)."
    limitations: "Single-class issuers only (AAPL verified: 14,594,180,000 at 2026-07-17, 10-Q filed 2026-07-31)."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, GOOGL, BRK-B, META]}

  - metric: market_cap_quote
    category: market
    canonical_definition: "Market capitalisation as published by the provider for one listed ticker."
    source: "Nasdaq quote"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol) (market_cap)"
    identifier: ticker
    period: "snapshot (delayed)"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL for some tickers."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot only; no history. Point-in-time market cap must be derived from historical close and the shares that were outstanding then."
    status: LIVE_VERIFIED
    fallback: "price x shares_outstanding for single-class issuers. Cboe quote market_cap is null."
    limitations: "Per-quote figure = that class's price x ALL shares of the issuer: GOOGL 4.137T, GOOG 4.096T, BRK.A 1.106T, BRK.B 1.104T describe one company each (E_LIVE_R3). Never sum listings."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, NVDA, MSFT, GOOGL, GOOG, BRK.A, BRK.B]}

  - metric: market_cap_issuer
    category: market
    canonical_definition: "One market cap per issuer (CIK), taken from the designated primary class."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: cik
    period: "snapshot"
    direct_or_derived: derived
    inputs: [market_cap_quote, share_class]
    formula: "market_cap of the primary class's quote; flag MULTI_CLASS_ALL_SHARES_AT_PRIMARY_PRICE when other classes exist."
    missing_data_behavior: "Primary class missing -> MISSING_INPUT; no silent switch to another class."
    negative_data_behavior: "Non-positive -> MISSING_INPUT."
    restatement_behavior: "Snapshot."
    status: DERIVED
    fallback: "price x shares_outstanding."
    limitations: "Choice of primary class (highest volume or first-listed) is a product decision."
    rule_function: issuer_market_cap
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [GOOGL, GOOG, BRK.A, BRK.B]}

  - metric: average_volume_and_dividend_yield
    category: market
