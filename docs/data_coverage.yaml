    status: NOT_VERIFIED
    fallback: "Compare with the broad benchmark only."
    limitations: "ETF history works (XLK live) but the Nasdaq-sector -> sector-ETF mapping was not defined or tested; Nasdaq sectors are not GICS so the ETF families do not align one to one."
    sample_tested: {live: false, evidence: [E_LIVE_R2], symbols: [XLK]}

  - metric: shares_outstanding
    category: market
    canonical_definition: "Shares outstanding of the issuer as reported on the cover of its latest periodic filing, with report date."
    source: "SEC XBRL dei"
    provider: sec
    command: "HTTP GET https://data.sec.gov/api/xbrl/companyfacts/CIK##########.json (dei:EntityCommonStockSharesOutstanding: val, end, filed, accn, form)"
    identifier: cik
    period: "instant (cover-page date, about 2 weeks after quarter end)"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Multi-class issuers: GOOGL and META have NO EntityCommonStockSharesOutstanding concept (only EntityPublicFloat); BRK-B's last point is from 2011. Return NULL; never sum or guess."
    negative_data_behavior: "n/a"
    restatement_behavior: "One point per filing (accn, filed); latest_known(as_of) selects."
    status: LIVE_VERIFIED
    fallback: "Implied shares = Nasdaq market_cap / last_price (all classes at that class's price). Do NOT use OpenBB's TTM weighted_ave_diluted_shares_os: it is about 4x the real count (AAPL TTM 59.1B vs 14.6B outstanding)."
    limitations: "Single-class issuers only (AAPL verified: 14,594,180,000 at 2026-07-17, 10-Q filed 2026-07-31)."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, GOOGL, BRK-B, META]}

  - metric: quoted_market_cap_per_listing
    category: market
    canonical_definition: "The provider's raw market_cap for one quoted listing. Semantics (measured): THAT listing's last price x ALL shares of the issuer. It is neither a security-specific market cap nor a single issuer figure, so it is only an input to issuer_market_cap and is stored raw with its source."
    source: "Nasdaq quote"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol) (market_cap)"
    identifier: ticker
    period: "snapshot (delayed)"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL for some tickers; Cboe's quote market_cap is null."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot only; no history. A point-in-time cap must be derived from a historical close and the shares outstanding at that time."
    status: LIVE_VERIFIED
    fallback: "close x shares_outstanding for single-class issuers."
    limitations: "GOOGL 4.137T at 338.24 and GOOG 4.096T at 334.93 imply the same share count (12.23B), so each figure is the class price x all shares; BRK.A 1.106T and BRK.B 1.104T likewise (share-equivalence of BRK.A not verified). Listings must never be summed."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, NVDA, MSFT, GOOGL, GOOG, BRK.A, BRK.B]}

  - metric: issuer_market_cap
    category: market
    canonical_definition: "THE canonical market capitalisation of the screening system: one value per issuer (CIK), the quoted figure of the issuer's designated primary listing. Used for every issuer-level valuation (P/S) against issuer-level revenue. Never described as security-specific."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: cik
    period: "snapshot"
    direct_or_derived: derived
    inputs: [quoted_market_cap_per_listing, share_class]
    formula: "quoted_market_cap_per_listing of the primary listing; flag MULTI_CLASS_ALL_SHARES_AT_PRIMARY_PRICE when other listings exist. Every listing of the issuer (GOOG and GOOGL) is screened on this one number."
    missing_data_behavior: "Primary listing figure missing -> MISSING_INPUT; no silent switch to another listing."
    negative_data_behavior: "Non-positive -> MISSING_INPUT."
    restatement_behavior: "Snapshot."
    status: DERIVED
    fallback: "primary close x shares_outstanding (single-class issuers only)."
    limitations: "Why issuer level: the screener's valuation inputs (revenue, earnings, debt) are issuer facts keyed by CIK, so the denominator must be issuer-wide; the provider already scales every listing to all shares, and a per-class cap is not computable (GOOGL has no dei shares fact and no per-class share counts exist in the data). The primary-listing choice (e.g. GOOGL for Alphabet, BRK.B for Berkshire) is a configuration decision, not data."
    rule_function: issuer_market_cap
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [GOOGL, GOOG, BRK.A, BRK.B]}

  - metric: security_market_cap
    category: market
    canonical_definition: "Market value of one share class only (shares of that class x that class's price)."
    source: "none"
    provider: none
    command: "none"
    identifier: security_id
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Never invented: NULL."
    negative_data_behavior: "n/a"
    restatement_behavior: "n/a"
    status: UNAVAILABLE
    fallback: "none; use issuer_market_cap."
    limitations: "Needs per-class shares outstanding. SEC dei EntityCommonStockSharesOutstanding is absent for GOOGL and META (multi-class, reported per class axis) and stale for BRK-B; no installed provider returns per-class counts."
    sample_tested: {live: true, evidence: [E_LIVE_R3], symbols: [GOOGL, BRK-B]}

  - metric: average_volume_and_dividend_yield
    category: market
    canonical_definition: "Provider-published average volume and dividend fields from the quote."
    source: "Nasdaq quote"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol) (average_volume, annualized_dividend, dividend_yield, ex_dividend_date)"
    identifier: ticker
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Null for non-payers (RIVN, BRK.B): NULL, not zero."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "obb.nasdaq.equity.fundamental.dividends (API shape only)."
    limitations: "Averaging window undocumented. Not a point-in-time series."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, RIVN, BRK.B]}

  # ------------------------------------------------------------------------------------------------ C. income statement
  - metric: revenue
    category: income_statement
    canonical_definition: "Total revenue for a fiscal period (us-gaap Revenues / RevenueFromContractWithCustomerExcludingAssessedTax / SalesRevenueNet, whichever the filer uses)."
    source: "SEC XBRL companyfacts via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(symbol, period=annual|quarterly|ttm, limit, pit_mode, include_preliminary) -> total_revenue"
    identifier: "ticker or cik"
    period: "FY, discrete quarter, or TTM; period_ending date + fiscal_period + fiscal_year"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Absent -> NULL. Tag used per period is reported in results_metadata.fields (AAPL SalesRevenueNet pre-2018, RevenueFromContract... after)."
    negative_data_behavior: "Negative revenue is returned as is and flagged by the screener as NOT_MEANINGFUL for margins (denominator <= 0)."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "Raw XBRL companyfacts (same data, with accn/filed) ; Nasdaq statements (obb.nasdaq.equity.fundamental.income, USD thousands, 4 periods, no filing metadata); XBRL frames for one concept across all filers (CY2023 revenue: 3,141 filers)."
    limitations: "Rows carry NO accession or filing date. Quarterly rows are discrete quarters; Q4 is derived by OpenBB. TTM rows are sums of four quarters. 96 columns, most all-null for any one filer. Nasdaq values are in thousands."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, MSFT, NVDA, RIVN, PTON, COST, KOSS, GOOGL, BRK-B]}

  - metric: cost_of_revenue
    category: income_statement
    canonical_definition: "Cost of revenue for the period."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> total_cost_of_revenue"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Absent for many financials and for BRK-B (NULL)."
    negative_data_behavior: "n/a"
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL CostOfRevenue / CostOfGoodsAndServicesSold."
    limitations: "Definition varies by filer (some include D&A, some not): cross-company gross margin is only roughly comparable."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, RIVN, NVDA]}

  - metric: gross_profit
    category: income_statement
    canonical_definition: "Revenue minus cost of revenue."
    source: "SEC via OpenBB (direct) else derived"
    provider: sec
    command: "obb.sec.income_statement(...) -> total_gross_profit"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM"
    direct_or_derived: direct
    inputs: []
    formula: "If total_gross_profit is absent: revenue - cost_of_revenue, flagged. Never when either is missing."
    missing_data_behavior: "Both absent -> NULL (BRK-B: not reported)."
    negative_data_behavior: "Negative gross profit is a real value (RIVN FY2024 -1.2B)."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "gross_profit_from_components(revenue, cost_of_revenue)."
    limitations: "OpenBB imputes some lines; check results_metadata.fields[*].sources to see what was computed vs reported."
    rule_function: gross_profit_from_components
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE], symbols: [AAPL, RIVN, NVDA]}

  - metric: operating_income
    category: income_statement
    canonical_definition: "Operating income (loss) for the period."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> total_operating_income"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL when absent."
    negative_data_behavior: "Negative is a real value (RIVN -3.585B)."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL OperatingIncomeLoss."
    limitations: "Banks and insurers do not report an operating-income line (JPM uses net interest income and noninterest lines)."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3], symbols: [AAPL, RIVN, BRK-B, JPM]}

  - metric: net_income_attributable_to_parent
    category: income_statement
    canonical_definition: "Net income attributable to the parent's common shareholders (us-gaap NetIncomeLoss). The screener's net income."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> net_income_to_common"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL when absent."
    negative_data_behavior: "Negative is a real loss."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL NetIncomeLoss (matches this field exactly for RIVN and NVDA)."
    limitations: "OpenBB's field named net_income is a different number: for RIVN FY2025 net_income = -3,626M (ProfitLoss, includes non-controlling interests) while net_income_to_common = -3,646M (NetIncomeLoss). Use net_income_to_common for margins, EPS and P/E."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [RIVN, NVDA, BRK-B]}

  - metric: net_income_consolidated
    category: income_statement
    canonical_definition: "Net income including non-controlling interests (us-gaap ProfitLoss)."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> net_income"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL when absent."
    negative_data_behavior: "Negative is a real loss."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL ProfitLoss."
    limitations: "Not the basis for per-share metrics. Equal to net_income_to_common when there are no non-controlling interests (NVDA, AAPL)."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [RIVN, NVDA]}

  - metric: diluted_eps
    category: income_statement
    canonical_definition: "Diluted earnings per share for the period, as reported."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> diluted_eps"
    identifier: "ticker or cik"
    period: "FY / quarter; TTM is NOT a reported figure"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "BRK-B returns no EPS at all (not in the non-null fields): NULL. Multi-class issuers report EPS per class; OpenBB returns one value (GOOGL populated)."
    negative_data_behavior: "Negative EPS is a real loss; growth and P/E treat it as NOT_MEANINGFUL."
    restatement_behavior: "Per-share values change with splits: NVDA FY2024 = 1.19 (default, post 10:1 split) vs 11.93 (pit_mode, as filed) while FY2023 stays 1.74 on the old basis. Never compare EPS across periods unless both come from the same filing (same_filing_pair)."
    status: LIVE_VERIFIED
    fallback: "raw XBRL EarningsPerShareDiluted with accn; or net_income_attributable_to_parent / weighted diluted shares from the same filing."
    limitations: "Split vintage trap (E_LIVE_R3). TTM EPS from OpenBB equals TTM net income over true shares (AAPL 8.72) but its share field is a four-quarter sum."
    rule_function: same_filing_pair
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE, E_UNIT], symbols: [NVDA, AAPL, RIVN, BRK-B]}

  - metric: weighted_average_diluted_shares
    category: income_statement
    canonical_definition: "Weighted-average diluted shares for the period."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...) -> weighted_ave_diluted_shares_os"
    identifier: "ticker or cik"
    period: "FY / discrete quarter. NOT TTM."
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL for BRK-B."
    negative_data_behavior: "n/a"
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL WeightedAverageNumberOfDilutedSharesOutstanding."
    limitations: "TTM rows are the SUM of four quarters (AAPL 59,114,516,000 vs 14,594,180,000 outstanding): invalid, and the screener must reject period=ttm for this field."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE], symbols: [AAPL, RIVN]}

  - metric: ebitda
    category: income_statement
    canonical_definition: "Operating income plus depreciation and amortization."
    source: "derived"
    provider: derived
    command: "obb.sec.income_statement(...) -> total_operating_income + depreciation_and_amortization"
    identifier: "ticker or cik"
    period: "FY / quarter / TTM (additive)"
    direct_or_derived: derived
    inputs: [operating_income]
    formula: "operating_income + depreciation_and_amortization; both required."
    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "Negative EBITDA is a value; ratios with it as a denominator are NOT_MEANINGFUL."
    restatement_behavior: *sec_vintage
    status: NOT_VERIFIED
    fallback: "none"
    limitations: "depreciation_and_amortization exists for NVDA, GOOGL, RIVN, BRK-B and JPM (field list, E_LIVE_R3) but its definition was not cross-checked against the filings. No rule function written yet."
    sample_tested: {live: true, evidence: [E_LIVE_R3], symbols: [NVDA, GOOGL, RIVN]}

  # ------------------------------------------------------------------------------------------------ D. cash flow
  - metric: operating_cash_flow
    category: cash_flow
    canonical_definition: "Net cash provided by operating activities for the period."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.cash_flow(symbol, period=annual|quarterly|ttm) -> net_cash_from_operating_activities"
    identifier: "ticker or cik"
    period: "FY, discrete quarter, TTM"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "NULL when absent."
    negative_data_behavior: "Negative is a real value."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL NetCashProvidedByUsedInOperatingActivities (filers report year-to-date; discrete quarters need subtraction)."
    limitations: "Quarterly rows are discrete: AAPL Q1+Q2+Q3 FY26 plus Q4 FY25 = 146,724M = the TTM figure exactly (E_LIVE_R3, E_FIXTURE_LIVE)."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3], symbols: [AAPL, RIVN, KOSS, BRK-B]}

  - metric: capital_expenditures
    category: cash_flow
    canonical_definition: "Cash paid for property, plant and equipment, as a positive magnitude."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.cash_flow(...) -> purchase_of_plant_property_and_equipment (returned NEGATIVE)"
    identifier: "ticker or cik"
    period: "FY / TTM; quarterly capex field was null for AAPL"
    direct_or_derived: direct
    inputs: []
    formula: "capex = abs(purchase_of_plant_property_and_equipment)"
    missing_data_behavior: "Absent is NOT zero: free_cash_flow returns MISSING_INPUT. The quarterly AAPL rows had this field null in the fields probed (the field name used may be wrong: NOT_VERIFIED for quarterly)."
    negative_data_behavior: "Sign is normalised by magnitude."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL PaymentsToAcquirePropertyPlantAndEquipment (positive) ; add PaymentsToAcquireProductiveAssets variants."
    limitations: "Capex definitions differ (software capitalisation, finance leases). AAPL FY2025 -12,715M; TTM -10,041M."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE], symbols: [AAPL]}

  - metric: free_cash_flow
    category: cash_flow
    canonical_definition: "Operating cash flow minus capital expenditures. The ONLY free-cash-flow definition."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "FY or TTM (same period for both inputs)"
    direct_or_derived: derived
    inputs: [operating_cash_flow, capital_expenditures]
    formula: "FCF = operating_cash_flow - abs(capex)"
    missing_data_behavior: "Either input missing -> MISSING_INPUT (CAPEX_NOT_REPORTED). Absent capex is never assumed zero."
    negative_data_behavior: "Negative FCF is valid."
    restatement_behavior: "Inputs from the same vintage."
    status: DERIVED
    fallback: "none"
    limitations: "Excludes acquisitions and leases. Stock-based comp is not removed."
    rule_function: free_cash_flow
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [AAPL]}

  # ------------------------------------------------------------------------------------------------ E. balance sheet
  - metric: cash_and_short_term_investments
    category: balance_sheet
    canonical_definition: "Cash and equivalents; short-term investments reported separately."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.balance_sheet(symbol, period) -> cash_and_equivalents, short_term_investments"
    identifier: "ticker or cik"
    period: "instant at period_ending"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "short_term_investments NULL means none reported (BRK-B)."
    negative_data_behavior: "n/a"
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL CashAndCashEquivalentsAtCarryingValue, ShortTermInvestments."
    limitations: "Long-term marketable securities (large at AAPL/MSFT) are not included, so net debt is conservative."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, RIVN, KOSS, BRK-B]}

  - metric: debt_components
    category: balance_sheet
    canonical_definition: "short_term_debt, current_portion_of_long_term_debt, long_term_debt (and finance lease liabilities where present)."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.balance_sheet(...) -> short_term_debt, current_portion_of_long_term_debt, long_term_debt, capital_lease_obligations"
    identifier: "ticker or cik"
    period: "instant"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Absent line = the extraction did not return it. It is NOT zero and NOT evidence of no debt: total_debt is MISSING_INPUT unless both core lines (current portion of long-term debt, long-term debt) are reported or the filing explicitly says there is no debt. short_term_debt is an optional additional component."
    negative_data_behavior: "A negative component -> NOT_MEANINGFUL."
    restatement_behavior: *sec_vintage
    status: LIVE_VERIFIED
    fallback: "raw XBRL LongTermDebtNoncurrent, LongTermDebtCurrent, ShortTermBorrowings (else CommercialPaper); DebtCurrent is not used."
    limitations: "AAPL FY2025: 7,979M + 12,350M + 78,328M. BRK-B shows none of the three lines on a USD 1.2T balance sheet (company_type 'diversified'): absent is not zero. Operating-lease liabilities are deliberately excluded."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, RIVN, KOSS, BRK-B]}

  - metric: company_type
    category: balance_sheet
    canonical_definition: "OpenBB/SEC statement template for the filer: industrial, financial, diversified (others not seen)."
    source: "SEC via OpenBB"
    provider: sec
    command: "obb.sec.income_statement(...).extra['results_metadata']['company_type']"
    identifier: cik
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Informational only: no metric rule depends on it (it no longer influences debt)."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot."
    status: LIVE_VERIFIED
    fallback: "SIC code (6xxx = finance/insurance/real estate)."
    limitations: "Seen: AAPL, GOOGL, NVDA, RIVN industrial; JPM financial (different field set: net interest income, provision for credit losses); BRK-B diversified. Insurers/REITs/utilities not sampled."
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_FIXTURE_LIVE], symbols: [AAPL, GOOGL, NVDA, RIVN, BRK-B, JPM]}

  - metric: total_debt
    category: balance_sheet
    canonical_definition: "short_term_debt + current_portion_of_long_term_debt + long_term_debt + finance leases. Operating leases excluded."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "instant"
    direct_or_derived: derived
    inputs: [debt_components]
    formula: "current_portion_of_long_term_debt + long_term_debt (+ short_term_debt when separately reported) (+ finance_lease_liabilities when reported). Zero ONLY if both core lines are explicitly reported (0 is a value) or the filing explicitly evidences no debt (explicit_no_debt_evidence). Never zero because a line is absent."
    missing_data_behavior: "Either core component (current portion of long-term debt, long-term debt) absent (and no explicit no-debt evidence) -> MISSING_INPUT (DEBT_COMPONENT_ABSENT:<names>): a partial sum is a lower bound, not the debt. short_term_debt absent: left out (never derived from LongTermDebtCurrent), flag SHORT_TERM_DEBT_NOT_REPORTED, line provenance NOT_REPORTED. No balance sheet -> MISSING_INPUT. Contradictory no-debt evidence -> NOT_MEANINGFUL. Finance leases absent: left out, flag FINANCE_LEASES_NOT_REPORTED."
    negative_data_behavior: "Negative component -> NOT_MEANINGFUL."
    restatement_behavior: "Same vintage for all components."
    status: DERIVED
    fallback: "none"
    limitations: "Banks' deposits and funding are not debt in this definition; leverage metrics are not meaningful for financials."
    rule_function: total_debt
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [AAPL, BRK-B]}

  - metric: net_debt
    category: balance_sheet
    canonical_definition: "total_debt minus cash_and_equivalents minus short_term_investments. Negative = net cash."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "instant"
    direct_or_derived: derived
    inputs: [total_debt, cash_and_short_term_investments]
    formula: "total_debt - cash_and_equivalents - short_term_investments (short-term investments absent = 0, flagged)."
    missing_data_behavior: "total_debt non-OK or cash missing -> MISSING_INPUT."
    negative_data_behavior: "Negative net debt is valid (net cash)."
    restatement_behavior: "Same vintage."
    status: DERIVED
    fallback: "none"
    limitations: "Excludes long-term investments."
    rule_function: net_debt
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [AAPL]}

  - metric: debt_to_equity
    category: balance_sheet
    canonical_definition: "total_debt divided by total stockholders' equity."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "instant"
    direct_or_derived: derived
    inputs: [total_debt, total_equity]
    formula: "total_debt / total_equity (total_equity = parent common equity, total_common_equity)."
    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "Equity <= 0 -> NOT_MEANINGFUL (a negative ratio would rank a distressed company as unlevered); zero equity -> ZERO_DENOMINATOR."
    restatement_behavior: "Same vintage."
    status: DERIVED
    fallback: "none"
    limitations: "Buyback-heavy filers can show tiny or negative equity (AAPL equity 73.7B on 359B assets is low)."
    rule_function: debt_to_equity
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [AAPL]}

  - metric: total_equity
