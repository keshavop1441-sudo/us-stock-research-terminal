    missing_data_behavior: "No balance sheet -> MISSING_INPUT (NO_BALANCE_SHEET). Absent component for a non-industrial/unknown filer -> MISSING_INPUT."
    negative_data_behavior: "Negative component -> NOT_MEANINGFUL."
    restatement_behavior: "Same vintage for all components."
    status: DERIVED
    fallback: "none"
