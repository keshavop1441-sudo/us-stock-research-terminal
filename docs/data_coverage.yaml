    kind: unit_tests
    description: "Executable metric rules: tests/test_metrics.py, tests/test_live_fixtures.py, tests/test_evidence_model.py."

environment:
  openbb_version: "openbb-core 2.0.1 (V5); extensions sec/nasdaq/cboe/news 2.0.0"
  credentials_required: false
  sec_user_agent: "SEC fair-access policy requires a contact in the User-Agent. OpenBB ships a placeholder UA that worked in the audit; production use needs a real contact configured by the operator (not set in this repository). A UA without an email-shaped contact got HTTP 403 (E_LIVE_R1)."
  sec_rate_limit: "SEC documents 10 requests/second; OpenBB defaults OPENBB_SEC_REQUESTS_PER_SECOND to 9. Not stress-tested."
  nasdaq_cboe_rate_limits: "Undocumented unofficial endpoints (api.nasdaq.com, cdn.cboe.com). No throttling seen at audit volume (about 70 calls per group). NOT verified at universe scale; both can change or block without notice."

# ---------------------------------------------------------------------------------------------------------------------
# Identity model (domain A)
# ---------------------------------------------------------------------------------------------------------------------
identity_model:
  issuer: "Keyed by CIK (10-digit text via app.models.identifiers.normalize_cik). Issuer-level facts (financial statements, filings, ownership of the issuer, events) key on cik."
  security: "A listed security (one ticker on one listing) keyed by securities.security_id; one issuer has many securities (GOOGL/GOOG/GOOGM/GOOGN under CIK 0001652044; BRK-A/BRK-B under 0001067983). Prices and quotes key on security_id."
  internal_ticker_spelling: "SEC spelling with '-' for the class suffix (BRK-B). Nasdaq and Cboe accept BRK.B; Nasdaq BRK/B returned EmptyDataError and Cboe BRK-B returned HTTP 403 (E_LIVE_R2). Implemented in app/models/symbols.py; only single-letter class suffixes are rewritten, preferred/unit/warrant conventions are NOT_VERIFIED and pass through unchanged."
  ticker_vs_cik: "A ticker is a lookup key that can be re-used, renamed or retired; the CIK is the stable key. obb.sec.cik_map(BRK-B) = 0001067983 and obb.sec.symbol_map(1067983) = BRK-B (E_LIVE_R3)."
  ticker_changes_and_history: "UNAVAILABLE as a dated history. SEC submissions give the current tickers plus formerNames (name history with dates, e.g. Facebook Inc until 2021-10-27 for META) but no former tickers. company_tickers_exchange.json is a current snapshot only (FB, TWTR, ATVI absent). Ticker history must be built by this project from dated snapshots of that file, forward from first ingestion; pre-ingestion history is not obtainable from the installed providers."
  discontinued_issuers: "Resolved by CIK: submissions for TWTR (0001418091) and ATVI (0000718877) still return filings (TWTR last filing 2022-12-02) with an empty ticker list. They are absent from company_tickers. Their prices are not available from Nasdaq/Cboe (Nasdaq profile TWTR: EmptyDataError)."
  mergers_and_name_changes: "A name change keeps the CIK (META). A pre-holding-company registrant has a different CIK (Google Inc. 0001288776 vs Alphabet 0001652044); successor linkage is NOT in the providers and would have to be curated."
  similar_tickers: "Search is by name/prefix and returns look-alikes (obb.sec.equity_search('BRK') returned BRK-B plus RBRK and BRKR; nasdaq search 'META' returned 35 rows). Resolution must be exact-match on canonical symbol or on CIK, never a prefix search."
  non_class_tickers_under_one_cik: "SEC lists GOOGM and GOOGN under Alphabet's CIK alongside GOOGL/GOOG: not every ticker under a CIK is a share class. Class labels come from the security name in the Nasdaq symbol directory ('Alphabet Inc. - Class C Capital Stock')."
  evidence: [E_LIVE_R2, E_LIVE_R3, E_FIXTURE_LIVE]

# ---------------------------------------------------------------------------------------------------------------------
# Classification (sector / industry) decision
# ---------------------------------------------------------------------------------------------------------------------
classification:
  systems_in_use:
    nasdaq: "Nasdaq sector (11 values: energy, basic_materials, industrials, consumer_staples, consumer_discretionary, health_care, financial_services, technology, communication_services, utilities, real_estate) and free-text industry. Source of the V5 screener (exchanges nasdaq, nyse, amex, all)."
    sec_sic: "SEC Standard Industrial Classification: 4-digit code + description per issuer. No sector."
    gics: "NOT USED. Nothing in the project produces, stores or assumes GICS. It is required only if the project later chooses it, as an explicit decision."
  decision: "Preserve the raw source classification and its source system. Never convert SIC to Nasdaq, Nasdaq to GICS, or the reverse. A query is evaluated in ONE named taxonomy."
  implementation: "app/screening/classification.py (Classification carries its system; matches_nasdaq / matches_sic; applying a filter to the wrong system raises TaxonomyError; missing or 'N/A' is unknown, not false). tests/test_classification.py."
  how_semiconductors_are_classified_live:
    nasdaq: "sector 'Technology', industry exactly 'Semiconductors': NVDA, AMD, AVGO, INTC, MU, TXN, TSM (TSM is NYSE-listed). QCOM is Technology / 'Radio And Television Broadcasting And Communications Equipment'; ASML is Technology / 'Industrial Machinery/Components'."
    sec_sic: "code 3674 'Semiconductors & Related Devices': NVDA, AMD, AVGO, INTC, TSM, MU, TXN. QCOM is 3663 and ASML 3559."
    note: "The two systems agree on this 14-name sample for the 3674/Semiconductors set but are different systems with different members elsewhere; the agreement is not a mapping."
  query_interpretation:
    - query: "Technology stocks excluding semiconductors"
      interpreted_as: "Nasdaq taxonomy: sector == 'Technology' AND industry != 'Semiconductors' (exact strings). Result on the sample: AAPL, MSFT, META, GOOGL, QCOM, ASML. The query is stated back to the user as a Nasdaq-taxonomy query."
      not_done: "No SIC test is mixed in; AMZN is excluded because Nasdaq files it under Consumer Discretionary; QCOM and ASML stay because Nasdaq does not call them semiconductors."
    - query: "Semiconductor companies (SEC definition)"
      interpreted_as: "SEC SIC code 3674."
    - query: "Technology sector (SIC)"
      interpreted_as: "Rejected as ill-formed: SIC has no sector. The user is asked to choose SIC codes or the Nasdaq sector."
  normalization_layer: "Not needed now. If a project grouping is ever required it is an explicit versioned mapping table (source system, source value) -> project group, kept alongside the raw columns, hand-reviewed, with the group named in results (see normalized_classification)."
  storage_requirement: "securities.sector / securities.industry hold Nasdaq's raw strings and securities.sic the SEC code; the provider of each must be recorded (schema_gaps G6). Do not reuse these columns for any converted value."
  evidence: [E_LIVE_R2, E_LIVE_R4, E_FIXTURE_LIVE]

# ---------------------------------------------------------------------------------------------------------------------
# SEC raw provenance design (canonical for accounting facts)
# ---------------------------------------------------------------------------------------------------------------------
sec_provenance:
  decision: "Raw SEC companyfacts (and submissions for filings) are the canonical provenance layer for accounting facts. OpenBB sec.income_statement / balance_sheet / cash_flow remain a convenient interface and a cross-check, never the store of record: its rows carry no accession, filed date or form and merge vintages."
  raw_sources:
    companyfacts: "https://data.sec.gov/api/xbrl/companyfacts/CIK##########.json (every concept, every filed vintage)"
    submissions: "https://data.sec.gov/submissions/CIK##########.json (filings index: accession, form, filing and report dates, items, acceptanceDateTime, primary document)"
    frames: "https://data.sec.gov/api/xbrl/frames/{taxonomy}/{concept}/{unit}/{frame}.json (cross-sectional pulls; latest value per filer, not a vintage store)"
  fields_preserved:
    cik: {record_field: "financial_facts.cik", note: "normalize_cik, 10-digit text"}
    taxonomy: {record_field: "financial_facts.taxonomy", note: "us-gaap, dei, ifrs-full, ..."}
    tag_concept: {record_field: "financial_facts.concept"}
    unit: {record_field: "financial_facts.unit", note: "USD, shares, USD/shares, pure"}
    value: {record_field: "financial_facts.value", note: "as reported; sign per tag"}
    start: {record_field: "financial_facts.period_start", note: "NULL means instant"}
    end: {record_field: "financial_facts.period_end"}
    instant: {record_field: "period_start IS NULL", note: "instant facts have no start key (dei shares, balance sheet items)"}
    filed: {record_field: "financial_facts.filed_date"}
    form: {record_field: "financial_facts.form", note: "10-K, 10-Q, 10-K/A, ..."}
    fy: {record_field: "financial_facts.fiscal_year"}
    fp: {record_field: "financial_facts.fiscal_period", note: "FY, Q1-Q3"}
    accn: {record_field: "financial_facts.accession_no", note: "part of the business key: vintages stay separate rows"}
    frame: {record_field: "financial_facts.frame", note: "stored since schema v3 (gap G7 closed in Phase 3A); NULL when the point carries no frame"}
    source_reference: {record_field: "sources.url + sources.command/parameters (schema v3)", note: "deterministic: RawFactPoint.source_ref = companyfacts URL + #taxonomy/concept/unit; filing_url derived from the accession number"}
  implementation: "app/models/sec_facts.py (RawFactPoint, parse_companyfacts_point: unknown keys rejected, instants preserved, frame never dropped silently); tests/test_sec_provenance.py."
  rules:
    - "Every ingested accounting fact row must have source_id, accession_no, filed_date and form (service-level check; SEC-sourced rows without an accession are rejected)."
    - "A restatement is a new row (new accession), never an update of the old one; point-in-time reads use latest_known(as_of)."
    - "OpenBB statements may populate screens' convenience columns only if each value is reconcilable to a raw point; mismatches are logged, raw wins."
    - "Re-fetch is idempotent: same (cik, taxonomy, concept, unit, period, accession) is the same fact."
  evidence: [E_LIVE_R2, E_LIVE_R3, E_FIXTURE_LIVE, E_UNIT]

# ---------------------------------------------------------------------------------------------------------------------
# Universe pilot design (must pass before any full-market load)
# ---------------------------------------------------------------------------------------------------------------------
universe_pilot:
  principle: "No full-universe ingestion until a pilot of about 100-500 representative securities passes every acceptance criterion below, measured and written to a pilot report. Phase 2 downloaded none of it."
  stages:
    - id: P0_dry_run
      size: "5-10 symbols (AAPL, GOOGL, BRK-B, RIVN, KOSS, TWTR, a bank, an ADR)"
      purpose: "Exercise every loader end to end on the audit's known cases; compare with the recorded fixtures."
    - id: P1_pilot
      size: "about 300 securities (allowed 100-500)"
      purpose: "Measure all acceptance criteria on a stratified sample, in a separate database file (DATABASE_PATH) that can be discarded."
    - id: P2_scale_gate
      size: "about 2,000 securities, drawn the same way"
      purpose: "Repeat the measurements; confirm request volume and time extrapolate to the full universe."
    - id: P3_full
      size: "full US universe"
      purpose: "Only after P1 and P2 both pass."
  selection:
    method: "Deterministic and reproducible: a fixed seed over the SEC company_tickers_exchange map, stratified; the chosen symbols are written to a manifest file in the pilot report. Not hand-picked."
    strata:
      - "Exchanges: Nasdaq, NYSE, NYSE American/AMEX (and OTC only as a negative sample): at least 30 securities each for the three listed venues."
      - "Size (Nasdaq market-cap buckets): mega, large, mid, small, micro: at least 20 each."
      - "Nasdaq sectors: all 11 represented (at least 10 each where the universe allows)."
      - "Multi-class issuers: at least 10 (GOOGL/GOOG, BRK, META-type) including their share-class tickers."
      - "Non-calendar fiscal years: at least 30 (52/53-week filers included)."
      - "Loss-making issuers: at least 30; negative equity: at least 5."
      - "Recent IPOs (under 3 years): at least 15 (short-history and no-5Y cases)."
      - "Financials (banks, insurers, diversified): at least 20; REITs/utilities: at least 10; ADRs/foreign filers: at least 10 (expected gaps)."
      - "Discontinued/renamed CIKs: at least 5; tickers with class suffixes: at least 5; recent 10-K/A filers: at least 5; known split names: at least 3."
  measurements:
    - {id: M1_identity, measure: "identity success rate", definition: "securities resolved to exactly one CIK / securities in the sample (ETFs and test issues excluded and counted separately)"}
    - {id: M2_cik_mapping, measure: "CIK mapping success and consistency", definition: "ticker->CIK and CIK->ticker agree for each resolved security; ambiguous or conflicting mappings listed"}
    - {id: M3_price, measure: "price success", definition: "securities with expected trading-day coverage / securities expected to have prices; duplicate (security_id, date) rows; unexplained gaps"}
    - {id: M4_sec_facts, measure: "SEC fact success", definition: "per core concept (revenue, net_income_to_common, operating cash flow, capex, total assets, equity, debt lines, shares) share of issuers with >= 4 fiscal years"}
    - {id: M5_missing, measure: "missing-data rate", definition: "NULL share per stored field and per derived metric state (MISSING_INPUT / NOT_MEANINGFUL / OK); zeros created from absence"}
    - {id: M6_duplicates, measure: "duplicate rate", definition: "rows violating a documented business key before upsert, and rows after (must be zero)"}
    - {id: M7_requests, measure: "request volume", definition: "requests per provider and per security, bytes, sustained requests/second (SEC)"}
    - {id: M8_failures, measure: "request failures", definition: "non-2xx responses, timeouts, retries, 403/429 counts by provider"}
    - {id: M9_warnings, measure: "provider warnings", definition: "every OpenBB/provider warning captured and categorised"}
    - {id: M10_time, measure: "ingestion time", definition: "wall time per stage; median and p95 per security; projected full-universe time and database size"}
    - {id: M11_upsert, measure: "upsert behaviour", definition: "second identical run inserts 0 rows; a changed value updates 1; an amendment adds a new accession; reads during a write report unavailable/cached honestly"}
    - {id: M12_crosschecks, measure: "cross-source agreement", definition: "52-week high vs Nasdaq year_high; issuer_market_cap vs close x dei shares (single-class); SEC revenue vs Nasdaq revenue (unit-adjusted)"}
  acceptance_criteria:
    - {id: A1, metric: M1_identity, threshold: ">= 99% resolved (denominator: US-listed operating-company securities); 0 unresolved ambiguous tickers"}
    - {id: A2, metric: M2_cik_mapping, threshold: "100% of resolved securities round-trip ticker->CIK->ticker (class tickers listed explicitly); 0 CIKs stored un-normalised"}
    - {id: A3, metric: M3_price, threshold: ">= 98% of expected securities with full expected coverage; 0 duplicate (security_id, trade_date); every unexplained gap over 5 trading days reviewed; split re-base detection correct on all sampled split names"}
    - {id: A4, metric: M4_sec_facts, threshold: ">= 95% of non-financial operating companies have revenue, net income to common, operating cash flow and total assets for the last 4 fiscal years; financials and ADRs reported separately, not hidden in the average"}
    - {id: A5, metric: M5_missing, threshold: "core fields (revenue, net_income_to_common, operating cash flow, equity) missing <= 5% for industrial filers; 0 debt values equal to 0 without explicit evidence; 0 NaN/inf stored"}
    - {id: A6, metric: M6_duplicates, threshold: "0 duplicate logical keys in every ingested table after load and after a full re-run"}
    - {id: A7, metric: M7_requests, threshold: "SEC sustained <= 9 requests/second; measured requests per security recorded; projected full-universe request count and wall time stated and acceptable (initial load <= 12 h, daily incremental <= 30 min on one machine)"}
    - {id: A8, metric: M8_failures, threshold: "<= 1% requests failing after retries; 0 SEC 403/429 responses; every failure class has a handler"}
    - {id: A9, metric: M9_warnings, threshold: "every provider warning categorised; 0 uncategorised warnings"}
    - {id: A10, metric: M10_time, threshold: "pilot completes without manual intervention; per-security p95 time recorded; extrapolation meets A7"}
    - {id: A11, metric: M11_upsert, threshold: "second identical run inserts 0 rows; one changed fact updates exactly 1 row; an amended filing adds a new accession row; no read ever shows stale data as live during a write"}
    - {id: A12, metric: M12_crosschecks, threshold: "52-week high within 0.5% of Nasdaq year_high for >= 95% of securities; issuer_market_cap within 2% of close x dei shares for >= 90% of single-class issuers; revenue within 1% of Nasdaq for >= 90% of compared issuers"}
    - {id: A13, metric: M5_missing, threshold: "100% of ingested provider rows carry source_id; 100% of SEC fact rows carry accession_no, filed_date and form; raw sector/industry/SIC stored with source and 0 converted classification values"}
  scaling_rule: "Scale from P1 to P2 only if every A1-A13 criterion passes with the pilot report attached. Any criterion failing, or any new unexplained provider behaviour, stops scaling: fix, then re-run the full pilot, not just the failed measurement. Scale from P2 to the full universe only if A1-A13 pass again and the extrapolation in A7 and A10 holds."
  report: "pilot_report.json plus a short markdown summary, written by the pilot run: all measurements M1-M12, the symbol manifest, the acceptance table (pass/fail per criterion) and the list of failures."
  not_in_phase_2: true

# ---------------------------------------------------------------------------------------------------------------------
# Price semantics (canonical)
# ---------------------------------------------------------------------------------------------------------------------
price_semantics:
  close_is_split_adjusted: "YES (LIVE, E_LIVE_R2). Cboe and Nasdaq agree: AAPL 2020-08-26 close 126.52 (4-for-1 split on 2020-08-31 is later), AMZN 2022-06-01 121.68 (20-for-1 in June 2022), NVDA 2024-06-04 116.44 (10-for-1 on 2024-06-10). The whole history is re-based by the provider whenever a new split occurs."
  close_includes_dividends: "NO, as far as measured: Cboe and Nasdaq closes for MSFT and KO are IDENTICAL on shared 2016 dates, i.e. neither provider applies a dividend adjustment (an adjusted series would differ by the cumulative dividend factor and the two vendors would be unlikely to agree). Not independently checked against exchange raw prints: treat 'not dividend-adjusted' as measured-by-agreement, not as exchange-certified."
  adjusted_close_field: "PriceRecord.adj_close stays NULL. No provider returns a dividend-adjusted close."
  returns_are: "PRICE returns only (close-to-close, no dividends, no reinvestment). Every price_return result carries the flag PRICE_RETURN_EXCLUDES_DIVIDENDS. They are labelled 'price return' everywhere and are never called total return."
  total_return: "UNAVAILABLE in Phase 2: needs verified dividend history (obb.nasdaq.equity.fundamental.dividends is API_SHAPE_VERIFIED only; adjustment basis unverified). Not computed, not approximated."
  benchmark_returns: "Benchmark price returns (SPY/QQQ/XLK ETF closes, SPX/COMP index closes) are also price-only, so stock-minus-benchmark compares like with like. Index total-return series are UNAVAILABLE."
  drawdown_definition: "drawdown_from_52w_high (canonical) = close / INTRADAY 52-week high - 1, the convention of Nasdaq's published year high (equal to max(high) for AAPL, NVDA, MSFT). drawdown_from_52w_closing_high = close / highest CLOSE in the window - 1 is a separate, explicitly named metric; the two are never interchanged."
  week52_window: "365 calendar days ending on the as-of date, inclusive; computed from daily history, never stored."
  consequence_of_split: "A split changes every stored historical close for that security; a refresh must compare overlapping dates and reload the full history when the ratio differs from 1, otherwise stored returns, highs and drawdowns silently mix bases."

# ---------------------------------------------------------------------------------------------------------------------
# Metric dictionary (canonical source of truth for the future screener). One entry per metric/dataset.
# ---------------------------------------------------------------------------------------------------------------------
_text:
  sec_vintage: &sec_vintage "SEC companyfacts keeps every filed vintage of a fact (accn, filed, form, fy, fp); a period appears in several filings (RIVN FY2024 NetIncomeLoss is in both the FY2024 and FY2025 10-Ks, same value) and occasionally with different values (KOSS 2017-Q3 revenue). OpenBB returns one wide row per period built from the latest vintage (pit_mode=false) or the as-first-filed one (pit_mode=true) and exposes NO accession or filing date per row. Ingest raw companyfacts points (accn+filed+form) and choose the vintage at query time with latest_known(as_of); never overwrite an older vintage."
  price_basis: &price_basis "Closes are split-adjusted and, as measured by Cboe/Nasdaq agreement on MSFT and KO, not dividend-adjusted (E_FIXTURE_LIVE; see price_semantics). A later split re-bases the whole provider history, so a refresh must compare overlapping rows and reload the full history when the ratio is not 1."
  no_restatement_market: &no_restate_market "Market data has no filing vintages. History is re-based by splits only; dividends do not change stored closes."
  tz_note: &tz_note "Dates are exchange-local trading dates as ISO strings; timestamps are naive. Nasdaq last_timestamp 2026-10-01T00:00:00 is a date, not an instant."

metrics:
  # ------------------------------------------------------------------------------------------------ A. identity
  - metric: issuer_cik
    category: identity
    canonical_definition: "The SEC Central Index Key of the issuer, 10-digit zero-padded text."
    source: "SEC EDGAR"
    provider: sec
    command: "obb.sec.cik_map(symbol)"
    identifier: "ticker (SEC spelling) -> cik"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Unknown ticker raises OpenBBError ('not found in SEC database'): treat as NULL cik and keep the row unresolved; never guess from a name."
    negative_data_behavior: "n/a"
    restatement_behavior: "Snapshot of the current ticker map; a retired ticker (TWTR, ATVI, FB) is not found."
    status: LIVE_VERIFIED
    fallback: "SEC company_tickers_exchange.json (HTTP GET https://www.sec.gov/files/company_tickers_exchange.json): 10,434 rows, 4 fields (cik, name, ticker, exchange)."
    limitations: "Result is a single object, not a list. 'BRKB' and 'TWTR' fail; 'BRK.B' not tested on this command (NOT_VERIFIED). Nasdaq's company profile returns cik NULL, so Nasdaq data can only be joined to SEC by ticker."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_LIVE_R3], symbols: [AAPL, BRK-B]}

  - metric: ticker_to_cik_universe_map
    category: identity
    canonical_definition: "All current ticker -> (cik, name, exchange) pairs, used to seed the securities table."
    source: "SEC EDGAR"
    provider: sec
    command: "HTTP GET https://www.sec.gov/files/company_tickers_exchange.json"
    identifier: "ticker -> cik"
    period: "snapshot (current)"
    direct_or_derived: direct
    inputs: []
    formula: null
