    negative_data_behavior: "n/a"
    restatement_behavior: "Append-only: an amendment is a NEW filing with its own accession, never an edit of the original."
    status: LIVE_VERIFIED
    fallback: "HTTP GET https://data.sec.gov/submissions/CIK##########.json: recent array plus paginated older files (META: 1002 recent rows and two older pages back to 2005); also gives acceptanceDateTime (FIXTURE_VERIFIED only), isXBRL, items."
    limitations: "Output columns: filing_date, report_date, report_type, accession_number, primary_doc, primary_doc_description, items, is_xbrl, report_url (no acceptance time, no amends link). form_type filter accepts only listed values (no '10-K/A', '10-Q/A'): E_LIVE_R2."
