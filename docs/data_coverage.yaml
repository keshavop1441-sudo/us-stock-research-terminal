# ---------------------------------------------------------------------------------------------------------------------
# Comparability rules (canonical; executable parts in app/screening/metrics.py)
# ---------------------------------------------------------------------------------------------------------------------
comparability_rules:
  - id: C1_same_period_kind
    rule: "Only compare like with like: fiscal year with fiscal year, discrete quarter with the same quarter a year earlier, TTM with TTM. QUARTER = 84-98 days, FISCAL_YEAR = 350-380 days (52/53-week years inside), YTD periods never compare with discrete quarters."
    function: comparable_year_over_year
  - id: C2_one_year_apart
    rule: "Period ends must be 350-380 days apart. A fiscal-year change (10-KT transition period, stub) is NOT_COMPARABLE."
    function: comparable_year_over_year
  - id: C3_same_vintage
    rule: "A growth rate or change uses current and prior values from the SAME filing (accession). Per-share values and restated amounts are otherwise on different bases (NVDA 1.19 vs 11.93 for FY2024)."
    function: same_filing_pair
  - id: C4_point_in_time
    rule: "A value is known from its filing date. Backtests and as-of screens use latest_known(points, as_of); filing dates are day-granular because OpenBB omits acceptance time."
    function: latest_known
  - id: C5_denominator_signs
    rule: "Growth needs prior > 0 and current >= 0. Margins need revenue > 0. P/E needs EPS > 0. Debt/equity needs equity > 0. A zero divisor is ZERO_DENOMINATOR; a negative or sign-changing base is NOT_MEANINGFUL. Nothing is turned into 0, infinity or a sign-flipped percentage."
    function: growth_rate
  - id: C6_missing_is_not_zero
    rule: "Absent data stays NULL and is never replaced by zero. Debt is zero only when reported as zero (both core long-term lines present) or explicitly evidenced by the filing; an absent debt line is MISSING. Absent capex is never zero. (Net debt treats an absent short-term-investments line as zero WITH a flag: that understates cash, so net debt errs high, never low.)"
    function: total_debt
  - id: C7_issuer_vs_listing
    rule: "Issuer metrics (issuer_market_cap, shares, fundamentals) are per CIK; listing metrics (price, return, volume) per security_id. issuer_market_cap is one number per issuer from the designated primary listing; never add listings' caps; security_market_cap is UNAVAILABLE and not invented."
    function: issuer_market_cap
  - id: C8_currency_and_units
    rule: "SEC values are USD in units; Nasdaq statements and institutional market values are USD thousands. Convert at ingestion, record the unit; non-USD reporters are not in scope until NOT_VERIFIED reported_currency handling is tested."
    function: null
  - id: C9_ttm_construction
    rule: "TTM = sum of four consecutive discrete quarters (or provider TTM for additive items). Never TTM for shares or per-share amounts built by summing. Fewer than four quarters = MISSING_INPUT."
    function: null
  - id: C10_mixed_report_periods
    rule: "Ownership rows from different report dates are not aggregated into one number."
    function: consistent_report_period
  - id: C11_corporate_actions
    rule: "Acquisitions, divestitures, spin-offs and accounting changes are NOT detectable from the providers: growth through such an event is flagged by humans only. Split re-basing of price history is detected by overlap comparison."
    function: null
  - id: C12_amendments
    rule: "A 10-K/A is a new filing. If it carries XBRL values for a period they become a newer vintage of that period; otherwise it changes nothing numeric. Amendment status is derived from the form code."
    function: latest_known

# ---------------------------------------------------------------------------------------------------------------------
# Source / evidence model review (Phase 1 had no class named SourceMetadata: the model is the `sources` table + SourceRecord)
# ---------------------------------------------------------------------------------------------------------------------
source_evidence_model:
  phase1_model: "SourceRecord(provider, dataset, url, content_hash, detail) -> sources(source_id, provider, dataset, url, content_hash, detail, retrieved_at). Append-only: one row per retrieval. Fact tables carry a nullable source_id. financial_facts also stores form, filed_date, accession_no, fiscal_year/period."
  sufficient_for:
    sec_filing: "Yes for facts and filings (accession, form, filing date, report date, URL, hash). Day-level point-in-time works from filed_date. Acceptance time and amendment link are not required."
    market_data: "Partly: provider, dataset and retrieval time exist; adjustment basis (split-only), delay and the provider's own as-of timestamp do not."
    news: "Yes with a stable source_ref (publisher URL, not a Google redirect) and event_date; publisher and published time have no column."
    government_award: "No: EventRecord cannot hold UEI, award id, modification number, amount or agency. Out of scope until awards are in scope."
  gaps_proven_by_audit:
    - id: S1_command_and_parameters
      need: "Structured command and parameters on every retrieval."
      proof: "Same command gave different data per parameter: pit_mode, period, limit, symbol spelling (BRK.B ok / BRK-B 403), Nasdaq narrow date window empty."
      stopgap_today: "JSON in sources.detail (tested in tests/test_evidence_model.py)."
      change: "sources.command VARCHAR, sources.parameters VARCHAR (JSON text)."
      status: "APPLIED in schema v3 (Phase 3A); every retrieval written by the P0 pipeline fills both."
      required_before_phase3: true
    - id: S2_provider_version
      need: "OpenBB core and extension versions that produced the rows."
      proof: "Field names and standardisation are version specific (V5 openbb-sec 2.0.0 fields such as net_income_to_common)."
      change: "sources.provider_version VARCHAR."
      status: "APPLIED in schema v3; filled for OpenBB retrievals ('openbb-cboe 2.0.0'), NULL for direct SEC HTTP (no versioned client)."
      required_before_phase3: true
    - id: S3_provider_as_of
      need: "The provider-reported timestamp of the data, separate from retrieved_at."
      proof: "Cboe quote last_timestamp 2026-10-01T15:59:59; Nasdaq last_timestamp date; both retrieved 2026-10-02."
      change: "sources.as_of TIMESTAMP (naive UTC, NULL when unknown)."
      status: "APPLIED in schema v3; filled for Nasdaq quotes (last_timestamp), NULL where the provider states none (SEC documents, history)."
      required_before_phase3: true
    - id: S4_source_required_on_ingested_rows
      need: "Ingested rows must name their retrieval."
      proof: "source_id is nullable on every fact table; an ingestion service must reject NULL for provider data."
      change: "No DDL; enforce in the ingestion service."
      status: "ENFORCED: the P0 pipeline records a source row before writing and checks it (QualityRepository.integrity_report: *_without_source = 0)."
      required_before_phase3: true
    - id: S5_license
      need: "Per-provider licence note."
      proof: "Not proven necessary by the audit: all sources are public, free and key-less. Documented in this file, not in the schema."
      change: "none"
      required_before_phase3: false

schema_gaps:
  - id: G1_ownership_line_detail
    table: ownership
    need: "transaction_price, shares_owned_after, acquired_disposed (A/D), is_derivative, security_title, ownership_nature (D/I), is_10b5_1 (nullable)."
    proof: "Live SEC insider rows carry price, securities_owned, acquisition_or_disposition, security_type, ownership_type; transaction_value is always null; 14 of 24 AAPL rows were derivative; raw XML carries aff10b5One."
    required_before: "insider ingestion (not before Phase 3 starts)"
    status: "APPLIED in schema v3 (columns + OwnershipRecord fields); no insider data is ingested in P0."
  - id: G2_price_adjustment_meaning
    table: price_daily
    need: "adj_close stays NULL (providers are split-adjusted only); document that close is split-adjusted as of the retrieval; refresh must detect re-basing."
    proof: "Cboe == Nasdaq closes on shared dates for MSFT and KO."
    required_before: "price ingestion"
    status: "ENFORCED: adj_close is always NULL (market_normalize) and checked (adjusted_close_populated = 0); split re-base detection is reported by the price stage."
  - id: G3_listing_identity
    table: securities
    need: "No new table now. share-class label and ticker history need either columns (share_class, valid_from, valid_to) or a history table, decided when ingestion starts; the SEC map is a snapshot so history accrues only from first ingestion."
    proof: "ticker_history UNAVAILABLE; GOOGL has four tickers under one CIK."
    required_before: "universe seeding"
    status: "DECIDED for P0, no schema change: listings of one issuer are grouped by CIK; the designated primary listing is fixed in app/ingestion/manifest.py; no share_class/valid_from columns and no ticker history are stored (UNAVAILABLE from providers)."
  - id: G4_government_awards
    table: "new (not created)"
    need: "awards table keyed (generated_unique_award_id, modification_number) plus an issuer alias table (UEI/name -> cik)."
    proof: "USAspending has no ticker/CIK; recipients are parent/child entities with different UEIs."
    required_before: "any contract ingestion (out of Phase 3 scope unless chosen)"
  - id: G6_classification_provenance
    table: securities
    need: "securities.sector/industry must hold Nasdaq's raw strings and securities.sic the SEC code, with the source recorded (a classification_source value or the provider on the retrieval); no converted values in those columns."
    proof: "Nasdaq and SEC classifications differ for the same issuer (QCOM 3663 vs 'Radio And Television Broadcasting...'; META/GOOGL 7370 vs 'Computer Software: Programming Data Processing')."
    required_before: "universe seeding"
    status: "APPLIED in schema v3: securities.sector_source (system of sector AND industry, 'nasdaq') and securities.sic_source ('sec')."
  - id: G7_fact_frame
    table: financial_facts
    need: "nullable `frame` VARCHAR column (SEC frame label such as CY2025Q4I) so the one provenance field the table cannot hold today is stored."
    proof: "Raw companyfacts points carry frame (live keys accn,end,filed,form,fp,frame,fy,start,val); FinancialFactRecord has no such field (tests/test_sec_provenance.py)."
    required_before: "SEC facts ingestion"
    status: "APPLIED in schema v3 (financial_facts.frame, FinancialFactRecord.frame)."
  - id: G5_filings_items
    table: filings
    need: "No change: 8-K items become events rows (source_ref = accession + item); acceptance_datetime not needed for day-level point-in-time."
    proof: "OpenBB exposes items but not acceptance time."
    required_before: "n/a"

representative_companies:
  AAPL: "Large non-calendar filer (FY ends late September, 52/53-week), single class: baseline for statements, dei shares, TTM share-sum trap, insider mix."
  MSFT: "June fiscal year; price/dividend adjustment check."
  NVDA: "January fiscal year; 10-for-1 split June 2024: per-share vintage trap; insider sales."
  AMZN: "Calendar FY; 20-for-1 split 2022: Cboe vs Nasdaq split agreement."
  GOOGL: "Multi-class (GOOGL/GOOG plus GOOGM/GOOGN under one CIK): no dei shares concept; per-quote market cap includes all shares."
  META: "Name change (Facebook Inc until 2021-10-27) but same CIK; no dei shares concept."
  AMD: "Recent 10-K/A (filed 2026-02-04): amendment handling."
  AVGO: "FY ends early November: non-calendar."
  RIVN: "Negative earnings and gross profit; non-controlling interests (net_income vs net_income_to_common); short history (listed 2021-11): no 5Y return."
  PTON: "Loss-making consumer name; June fiscal year; 8-K item mix."
  COST: "52/53-week fiscal year ending near 31 August."
  KOSS: "Smaller cap; restated period in raw companyfacts (2017-Q3 revenue); sparse statements."
  BRK-B: "Multi-class (BRK-A/BRK-B), SEC vs Nasdaq spelling, company_type diversified, no debt lines or EPS, 13F filer."
  TWTR: "Discontinued: CIK still resolves, no ticker, no prices."
  ATVI: "Discontinued (acquired 2023)."
  JPM: "company_type financial: different statement template."
  TSLA: "Amendments scan (10-K/A 2025 and 2026)."

# ---------------------------------------------------------------------------------------------------------------------
# Phase 3A: the P0 ingestion pilot (14 securities). Methodology and status; results are in the pilot report, not here.
# ---------------------------------------------------------------------------------------------------------------------
p0_pilot:
  purpose: "Prove the production ingestion architecture end to end on a very small representative set. Not a screener, not P1."
  code: "scripts/run_p0.py (live) ; tests/p0_rehearsal.py (simulated, mechanics only) ; app/ingestion/* ; app/services/ingestion_service.py"
  schema_version_required: 3
  manifest:
    selection: "Hand-chosen from the Phase 2 probe evidence and pinned (app/ingestion/manifest.py, digest tested). Deliberately wider than the YAML P0 stage (5-10 symbols) because the brief asks for ten-plus coverage categories."
    securities: [AAPL, NVDA, AMD, GOOGL, GOOG, BRK-B, META, RIVN, PTON, KOSS, COST, JPM, TSM, TSLA]
    issuers: 13
    deviation_from_phase2_p0: "TWTR (discontinued issuer with no ticker) is not in the set: the pipeline resolves identity from the SEC ticker map, in which a retired ticker does not exist. Discontinued issuers need a CIK-keyed entry path that P0 does not build."
  stages: [identity, prices, quotes, sec_facts, validation, derived_metrics]
  sources:
    identity_and_filings: "SEC company_tickers_exchange.json + submissions (direct HTTP, SEC_USER_AGENT)"
    accounting_facts: "SEC companyfacts (direct HTTP) - canonical; OpenBB statements are not ingested"
    prices: "obb.cboe.equity.historical (primary), obb.nasdaq.equity.historical (fallback, stored with sources.is_fallback = TRUE)"
    quote_market_cap_classification: "obb.nasdaq.equity.quote (last price, market_cap, year high/low, raw sector/industry). No fallback exists for market cap: a failure leaves issuer_market_cap MISSING_INPUT."
  concurrency: "One writer lock and one transaction for the whole run (the refresh process holds the lock). A fetch/normalise failure of one symbol is recorded and skipped; a database error rolls the whole run back."
  tag_selection:
    rule: "app/models/concepts.py: per period the first candidate tag that reports it wins; a lower-priority tag with a >1% different value for the same period makes the line unreliable (TAG_CONFLICT -> MISSING_INPUT). No tag is trusted blindly and no value is guessed."
    live_probed_in_phase_2: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet, PaymentsToAcquirePropertyPlantAndEquipment, NetCashProvidedByUsedInOperatingActivities, EarningsPerShareDiluted, NetIncomeLoss, ProfitLoss, LongTermDebtNoncurrent, LongTermDebt, EntityCommonStockSharesOutstanding]
    not_probed_individually: [GrossProfit, OperatingIncomeLoss, StockholdersEquity, CashAndCashEquivalentsAtCarryingValue, Cash, ShortTermInvestments, MarketableSecuritiesCurrent, ShortTermBorrowings, CommercialPaper, LongTermDebtCurrent, WeightedAverageNumberOfDilutedSharesOutstanding, RevenueFromContractWithCustomerIncludingAssessedTax]
    finding: "Phase 2 recorded candidate tags in a probe script and an OpenBB-field-to-concept dictionary, not an executable 'tested tag selection logic'. The selection above is new in Phase 3A; its tags outside live_probed_in_phase_2 are NOT_VERIFIED until the P0 live report shows them."
    net_income: "NetIncomeLoss only (attributable to the parent). ProfitLoss is never a fallback and is not stored."
    capex: "PaymentsToAcquirePropertyPlantAndEquipment only; absent -> FCF MISSING_INPUT."
    debt: "(ShortTermBorrowings, else CommercialPaper) + LongTermDebtCurrent + LongTermDebtNoncurrent at ONE balance-sheet date; CommercialPaper is a short-term borrowing instrument (how AAPL reports its short-term debt) and is read only where ShortTermBorrowings is absent for that date, two disagreeing tags are TAG_CONFLICT; DebtCurrent is deliberately NOT mapped (it already contains the current portion of long-term debt: double counting); CommercialPaper is NOT_VERIFIED live until the next live ingest shows it; short_term_debt is optional (absent -> flag SHORT_TERM_DEBT_NOT_REPORTED); an absent LongTermDebtCurrent or LongTermDebtNoncurrent -> MISSING_INPUT; no explicit-no-debt evidence is ingested in P0, so a debt of 0 only arises from two explicitly reported zeros (and any reported short-term zero)."
  periods:
    identification: "By the point's own start/end dates (period_kind), never by fy/fp, which describe the filing."
    ttm: "latest fiscal year + current YTD - prior-year YTD, one tag, YTD aligned to the fiscal year by dates (+-7 days); latest report a 10-K -> that fiscal year; misaligned -> NOT_COMPARABLE; missing prior YTD -> MISSING_INPUT."
    growth: "Fiscal-year growth uses ONE filing for both years (same_filing_pair). TTM growth uses current vintages per period, flags TTM_COMPONENTS_FROM_SEVERAL_FILINGS and is NOT_COMPARABLE if any component period was restated."
    ttm_eps: "Sum of per-share periods (flagged PER_SHARE_SUM_OF_PERIODS) with a split guard on weighted diluted shares (ratio outside 0.55-1.8 -> NOT_COMPARABLE POSSIBLE_SPLIT_BASIS_CHANGE; counts missing -> MISSING_INPUT). No TTM share count is ever built."
    restatements: "Each accession is its own row; amendments (10-K/A) are separate rows; the current view takes the latest filed vintage, a point-in-time read (StatementIndex.select as_of) the latest filed on or before the date. Only filing-date granularity is claimed (no acceptance time)."
  market_cap: "issuer_market_cap = the quoted figure of the designated primary listing (GOOGL for Alphabet, BRK-B for Berkshire). security_market_cap is not created. Valuation divides it by issuer revenue."
  idempotency: "Upserts classify every record as inserted / updated (values differ) / unchanged (not rewritten, keeps the source_id of its first retrieval) / duplicate (repeated key inside the batch). source_id is provenance, ignored when deciding 'changed'. sources is an append-only retrieval log and grows by one row per retrieval on a re-run by design."
  not_in_p0: [ifrs_accounting_facts, insider_transactions, institutional_holders, earnings, news, events, government_awards, splits_and_dividends, security_type, share_class, ticker_history, discontinued_issuers]
  taxonomy_coverage:
    supported: "us-gaap (the P0 concept set, app/models/concepts.py) and dei cover-page counts for single-class issuers."
    unsupported: "ifrs-full (foreign private issuers filing 20-F/40-F under IFRS; observed live: TSM companyfacts taxonomies ['dei', 'ifrs-full', 'srt'])."
    decision: "IFRS is NOT implemented in P0. It is an explicit, expected unsupported taxonomy, not a failure."
    why_not_implemented: "(1) No live evidence exists for which ifrs-full tags a given issuer uses or how they map to the canonical lines, and a mapping must not be invented. (2) Such issuers report in a non-USD currency (TSM: TWD) while issuer_market_cap is USD: P/S, P/E and every USD comparison would need currency handling (comparability rule on units and currency) that is not designed or verified. (3) ADS-to-ordinary-share ratios make dei share counts unreliable."
    representation:
      detection: "app/ingestion/sec_normalize.parse_companyfacts: an unsupported accounting taxonomy and NO supported one -> FactsParse.unsupported_taxonomy; nothing is stored (not even dei shares)."
      reporting: "stage sec_facts counts it as expected_unsupported (not failed); RunReport.expected_unsupported lists issuer, CIK, taxonomy and taxonomies seen; SymbolOutcome.facts_status = UNSUPPORTED_TAXONOMY; the report verdict lists it under known coverage limitations."
      persistence: "the companyfacts retrieval row (sources.detail notes) records UNSUPPORTED_TAXONOMY:<taxonomy>; ReadRepository.fact_support_notes(cik) returns it, so 'no facts' is always explainable."
      downstream: "build_snapshot(facts_unavailable=...) makes every fundamental metric (growth, margins, FCF, debt, TTM, P/S, P/E inputs) MISSING_INPUT with reason UNSUPPORTED_TAXONOMY:ifrs-full: never 0, never a percentage. Identity, prices, quotes, classification and price metrics (returns, drawdown) still work. The issuer is excluded from the A12 market-cap cross-check with reason FACTS_UNAVAILABLE."
    still_genuine_failures: "A document with us-gaap present but none of the allow-listed concepts (NO_ALLOWLISTED_FACTS), a malformed document, HTTP failures and a missing CIK remain failures."
    future_option: "A scoped IFRS path (validated tag mapping per concept, currency-aware metrics, fixtures) is a separate, later task; it would replace this classification for the issuers it supports."
  acceptance_semantics:
    component_statuses: [PASS, FAIL, NOT_EVALUABLE, DEFERRED, EXPECTED_UNSUPPORTED]
    criterion_statuses: [PASS, FAIL, PARTIAL, NOT_EVALUABLE, DEFERRED, EXPECTED_UNSUPPORTED]
    derivation: "A criterion is the sum of its REQUIRED components (app/ingestion/acceptance.py). FAIL if any component FAILED; PASS only if EVERY required component PASSED; PARTIAL if at least one passed and at least one was not evaluated or unsupported; DEFERRED if nothing passed and a component needs data that is intentionally not ingested; NOT_EVALUABLE if nothing passed and nothing could be measured in this run; EXPECTED_UNSUPPORTED if every component is. Statuses are derived, never set by hand, and the component list of each criterion is pinned (REQUIRED_COMPONENTS) so a requirement cannot be dropped silently."
    overall_verdict: "Three separate statements: pipeline execution (COMPLETED / COMPLETED_WITH_FAILURES / ABORTED / DID_NOT_RUN), acceptance criteria (ACCEPTED / INCOMPLETE / FAILED / NOT_RUN) and known coverage limitations (listed, never a substitute for a PASS). Overall is ACCEPTED only with a clean execution AND every criterion PASS; otherwise INCOMPLETE (nothing failed but something is unevaluated) or FAILED. The P1 progression gate is a fourth, separate statement (progression_gate below), never a consequence of the overall verdict."
    progression_gate:
      question: "Are there any unresolved P0 blockers that prevent beginning P1?"
      implementation: "app/ingestion/progression.py (decision layer over the acceptance criteria; it never changes a PASS/PARTIAL/DEFERRED status). Re-decide from a stored report without provider access: python scripts/p1_gate.py <report.json> --tests-status passed|failed (or --run-tests)."
      open_only_if: "pipeline COMPLETED with 0 genuine failures; the run was LIVE; every integrity_report count is 0; the automated tests are reported PASSED (not reported = CLOSED); no component FAILED; and every non-PASS component has an explicit ComponentPolicy with blocking_for_p1_entry false."
      fail_closed: "A non-PASS component without a policy entry blocks. A FAIL always blocks, whatever its policy."
      policy_fields: [blocking_for_p0_completion, blocking_for_p1_entry, deferred_to, evidence_source, live_trigger_required, reason]
      non_blocking_by_policy: "A3 split_rebase_true_detection (needs a real split; hermetic test), A4 total_assets (deferred to P1, must be measured before P1 -> P2), A7 full_universe_projection (P1), A10 extrapolation_meets_a7 (P2), A11 changed_fact_updates_one / amendment_adds_accession / reads_honest_during_write (hermetic tests; the live re-run proves idempotency), A12 revenue_vs_nasdaq (Nasdaq statements not ingested). All of these stay DEFERRED / NOT_EVALUABLE and their criteria stay PARTIAL."
      report: "The verdict shows OVERALL P0 ACCEPTANCE, PIPELINE EXECUTION and P1 PROGRESSION GATE as three separate lines, then blockers, explicitly deferred items, expected-unsupported coverage and, per non-PASS criterion, whether it blocks P1 and why."
    simulated_runs: "Provider-behaviour components are NOT_EVALUABLE in a simulated run; only mechanical components (duplicates, provenance, re-run) are evaluated."
    a12_measurable_now: "week52_high_vs_nasdaq (Nasdaq year_high is ingested on every quote) and market_cap_vs_close_x_shares (issuer_market_cap vs last close x dei shares, only for ELIGIBLE issuers: single-class, reliable dei shares, market cap present, facts available; the report states numerator, denominator and every exclusion with its reason)."
    a12_not_measurable_now: "revenue_vs_nasdaq: Nasdaq statements are not ingested, so the component is DEFERRED and A12 can be at most PARTIAL."
    other_deferred_components: "A3 split_rebase_true_detection (needs a refresh across a real split), A4 total_assets (not in the P0 concept set), A7/A10 full-universe projection (needs P1), A11 changed-fact / amendment / read-during-write (hermetic tests only)."
  live_status:
    first_live_run: "Workflow run 36965720655 on main commit d37dafd (workflow_dispatch, GitHub-hosted runner). Figures as reported by the operator, not re-read from the artifact by the assistant (sandbox egress blocks the artifact host): 14 securities, 13 issuers, identity 14/14, prices 14/14, quotes 14/14, SEC facts 12/13 (TSM unsupported), 27 SEC requests, peak 8/s, 0 HTTP 403/429, 0 retries, 45,878 rows inserted, second identical run 0 inserted / 0 updated / 45,878 unchanged, runtime 32.9 s. Its report marked every criterion PASS including A12 with 'Nasdaq revenue: not ingested': that was a reporting-semantics defect, fixed in Phase 3A hardening (acceptance_semantics above). Five provider warnings (3 DUPLICATE_PROVIDER_ROWS, 1 REJECTED_PRICE_ROWS, 1 NO_NASDAQ_CLASSIFICATION) could not be attributed to a ticker or provider from that report; warnings now carry ticker, provider, stage, command and row details."
