    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "Equity <= 0 -> NOT_MEANINGFUL (a negative ratio would rank a distressed company as unlevered); zero equity -> ZERO_DENOMINATOR."
    restatement_behavior: "Same vintage."
    status: DERIVED
    fallback: "none"
