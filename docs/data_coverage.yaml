  # ------------------------------------------------------------------------------------------------ B. price / market
  - metric: price_daily_ohlcv
    category: market
    canonical_definition: "Daily open, high, low, close, volume per trading date, split-adjusted, not dividend-adjusted."
    source: "Cboe delayed data"
    provider: cboe
    command: "obb.cboe.equity.historical(symbol)"
    identifier: "ticker (Cboe spelling: BRK.B)"
    period: "daily; ISO date string; since listing or 2004-01-02"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Two gaps over 4 days in AAPL's history (2006-12-29 to 2007-01-03 and 2012-10-26 to 2012-10-31) coincide with known market closures (not independently verified): store what is returned, never fill. Options volume columns are mostly null."
    negative_data_behavior: "n/a"
    restatement_behavior: *price_basis
    status: LIVE_VERIFIED
    fallback: "obb.nasdaq.equity.historical(symbol): same split-adjusted convention, only about 10 years deep (AAPL from 2016-10-03), narrow date windows returned EmptyDataError so pull the full range and slice client-side. Cboe quote for the dash spelling BRK-B returned HTTP 403 (history not tested with it)."
    limitations: "Unofficial CDN endpoint, no SLA. Adjusted close equal to close: PriceRecord.adj_close must stay NULL (it would be a lie if filled with the split-adjusted close). Verified splits: AAPL 2020, AMZN 2022, GOOGL 2022, NVDA 2024 (Cboe and Nasdaq agree on pre-split rows)."
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_OPENBB, E_FIXTURE_LIVE], symbols: [AAPL, AMZN, GOOGL, NVDA, MSFT, KO, RIVN]}

  - metric: price_current_delayed
    category: market
    canonical_definition: "Latest delayed quote: last price, previous close, day range, volume."
    source: "Nasdaq / Cboe"
    provider: nasdaq
    command: "obb.nasdaq.equity.quote(symbol); obb.cboe.equity.quote(symbol)"
    identifier: "ticker (BRK.B)"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "Nasdaq returns open/bid/ask null outside hours; Cboe supplies open, iv30 and its own last_timestamp (2026-10-01T15:59:59). Nasdaq last_timestamp is a date at midnight."
    negative_data_behavior: "n/a"
    restatement_behavior: *no_restate_market
    status: LIVE_VERIFIED
    fallback: "Cboe quote for price/range; last close from price_daily_ohlcv."
    limitations: "Delayed, not live, and never shown as live. The two providers disagreed on AAPL's last price (Nasdaq 330.32, Cboe 330.78) when queried together after the close; the cause (regular close vs after-hours print) was not verified. Market state from obb.nasdaq.markets.status."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: [AAPL, NVDA, RIVN, BRK.B]}

  - metric: market_calendar
    category: market
    canonical_definition: "Whether the US market is open, previous and next trading dates, session times."
    source: "Nasdaq"
    provider: nasdaq
    command: "obb.nasdaq.markets.status()"
    identifier: "market"
    period: "snapshot"
    direct_or_derived: direct
    inputs: []
    formula: null
    missing_data_behavior: "n/a"
    negative_data_behavior: "n/a"
    restatement_behavior: "n/a"
    status: LIVE_VERIFIED
    fallback: "Derive trading days from the dates present in price_daily_ohlcv."
    limitations: "Only the current and adjacent trading day; no historical holiday calendar. Times are exchange-local (US Eastern) without an offset: see tz_note."
    sample_tested: {live: true, evidence: [E_LIVE_R2], symbols: []}

  - metric: week52_high_low
    category: market
    canonical_definition: "Highest high and lowest low over the 365 calendar days ending on the as-of date (intraday), plus close-based variants. Never stored; always computed from price_daily_ohlcv."
    source: "derived from daily history; Nasdaq quote year_high/year_low as cross-check"
    provider: derived
    command: "derived; cross-check obb.nasdaq.equity.quote (year_high, year_low)"
    identifier: security_id
    period: "365 calendar days ending as_of (inclusive)"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv]
    formula: "high_52w = max(high), low_52w = min(low) over rows with as_of-365d <= date <= as_of; also high_52w_close / low_52w_close."
    missing_data_behavior: "Fewer than 20 rows -> MISSING_INPUT (INSUFFICIENT_HISTORY); fewer than 240 rows -> OK with PARTIAL_WINDOW flag (recent IPO)."
    negative_data_behavior: "n/a"
    restatement_behavior: "Recomputed on any history re-base (split)."
    status: DERIVED
    fallback: "Nasdaq quote year_high/year_low (current only, not point-in-time)."
    limitations: "My intraday computation equalled Nasdaq's published year high and low exactly for AAPL, NVDA, MSFT (E_LIVE_R2), so Nasdaq uses the intraday convention; the close-based number is lower (AAPL 341.07 vs 345.34)."
    rule_function: high_low_52w
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_FIXTURE_LIVE, E_UNIT], symbols: [AAPL, NVDA, MSFT]}

  - metric: price_return
    category: market
    canonical_definition: "PRICE return (close-to-close, dividends excluded; NOT total return) over 1D, 1W, 1M, 3M, 6M, 1Y, 3Y, 5Y: last close on/before as_of divided by last close on/before the calendar-anchored start, minus 1."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: security_id
    period: "1D=1 day, 1W=7 days, 1M=1 calendar month, 3M, 6M, 1Y=12 months, 3Y, 5Y; anchors month-end clamped"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv]
    formula: "lookback_return(closes, as_of, days|months|years) = close(as_of)/close(anchor) - 1; anchor = anchor_date(as_of, ...)."
    missing_data_behavior: "Series starts after the anchor (recent IPO: RIVN has no 5Y) -> MISSING_INPUT INSUFFICIENT_HISTORY; base close more than 7 days before the anchor -> MISSING_INPUT BASE_PRICE_STALE. Never substitute a shorter horizon."
    negative_data_behavior: "Base price <= 0 -> MISSING_INPUT."
    restatement_behavior: "Recomputed after a split re-base; flagged PRICE_RETURN_EXCLUDES_DIVIDENDS."
    status: DERIVED
    fallback: "none needed"
    limitations: "Dividend-excluded: a high-yield stock's total return is understated. Nasdaq history is only 10 years deep, so 5Y works but 10Y needs Cboe."
    rule_function: lookback_return
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [RIVN]}

  - metric: drawdown_from_52w_high
    category: market
    canonical_definition: "Latest close divided by the INTRADAY 52-week high, minus 1 (zero or negative). The closing-high variant is drawdown_from_52w_closing_high."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: security_id
    period: "as_of"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv, week52_high_low]
    formula: "close / high_52w - 1 (high_52w = max intraday high over the window)."
    missing_data_behavior: "Missing close or high -> MISSING_INPUT."
    negative_data_behavior: "close above its own window high -> NOT_MEANINGFUL (CLOSE_ABOVE_HIGH): the data is inconsistent."
    restatement_behavior: "Recomputed after split re-base."
    status: DERIVED
    fallback: "none"
    limitations: "Uses the intraday high, so drawdown is slightly larger than a close-to-close drawdown."
    rule_function: drawdown_from_high
    sample_tested: {live: true, evidence: [E_UNIT, E_LIVE_R2], symbols: [AAPL, NVDA, MSFT]}

  - metric: drawdown_from_52w_closing_high
    category: market
    canonical_definition: "Latest close divided by the highest CLOSE of the 52-week window, minus 1. Distinct from drawdown_from_52w_high (intraday-high basis)."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: security_id
    period: "as_of"
    direct_or_derived: derived
    inputs: [price_daily_ohlcv, week52_high_low]
    formula: "close / high_52w_close - 1 (high_52w_close = max close over the 365-day window)."
    missing_data_behavior: "Missing close or window -> MISSING_INPUT."
    negative_data_behavior: "close above the window's closing high -> NOT_MEANINGFUL (CLOSE_ABOVE_HIGH)."
    restatement_behavior: "Recomputed after split re-base."
    status: DERIVED
    fallback: "none"
    limitations: "Always a smaller drawdown than the intraday basis (AAPL 2026-09-30: closing high 341.07 vs intraday 345.34). A screen must state which basis it uses."
    rule_function: drawdown_from_high
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [AAPL, NVDA, MSFT]}

