  # ------------------------------------------------------------------------------------------------ F. derived ratios and growth
  - metric: revenue_growth_yoy
    category: derived
    canonical_definition: "(revenue now / revenue same period one year earlier) - 1, for a fiscal year or a discrete quarter."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "FY vs prior FY; quarter vs same quarter prior year"
    direct_or_derived: derived
    inputs: [revenue]
    formula: "growth_rate(current, prior) = current/prior - 1, only if prior > 0 and current >= 0."
    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "prior == 0 -> ZERO_DENOMINATOR; prior < 0 -> NOT_MEANINGFUL (NEGATIVE_BASE); prior <= 0 and current > 0 (or sign flip) -> NOT_MEANINGFUL (SIGN_CHANGE). Never negative->positive growth, never 0->positive as a percentage."
    restatement_behavior: "Use same_filing_pair so both periods are on one basis; comparability checked with comparable_year_over_year."
    status: DERIVED
    fallback: "none"
    limitations: "Acquisitions inflate growth: no M&A adjustment is available from any provider (NOT_COMPARABLE cannot be detected; flag only through a human)."
    rule_function: growth_rate
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [NVDA, RIVN]}

  - metric: revenue_growth_ttm_yoy
    category: derived
    canonical_definition: "TTM revenue now vs TTM revenue four quarters earlier."
    source: "derived"
    provider: derived
    command: "obb.sec.income_statement(period=ttm) or sum of four discrete quarters"
    identifier: "ticker or cik"
    period: "TTM vs TTM one year earlier"
    direct_or_derived: derived
    inputs: [revenue]
    formula: "growth_rate(TTM_now, TTM_prior)"
    missing_data_behavior: "Fewer than four consecutive quarters -> MISSING_INPUT."
    negative_data_behavior: "As revenue_growth_yoy."
    restatement_behavior: "Quarters from one vintage."
    status: DERIVED
    fallback: "sum of four discrete quarters."
    limitations: "TTM windows spanning a fiscal-year change or a 53-week year are NOT_COMPARABLE."
    rule_function: growth_rate
    sample_tested: {live: true, evidence: [E_LIVE_R2, E_UNIT], symbols: [AAPL]}

  - metric: eps_growth_yoy
    category: derived
    canonical_definition: "Growth of diluted EPS (or of net income attributable to parent) between comparable periods."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "FY vs prior FY; quarter vs same quarter prior year"
    direct_or_derived: derived
    inputs: [diluted_eps, net_income_attributable_to_parent]
    formula: "growth_rate(eps_now, eps_prior) where both come from the same filing (same_filing_pair)."
    missing_data_behavior: "No filing carries both -> MISSING_INPUT."
    negative_data_behavior: "Loss in either period -> NOT_MEANINGFUL: -3.07 vs -4.69 (RIVN) is not growth; loss to profit is SIGN_CHANGE; 0 prior is ZERO_DENOMINATOR."
    restatement_behavior: "Split vintages mix bases (NVDA); same_filing_pair is required."
    status: DERIVED
    fallback: "net income growth with the same rules."
    limitations: "Naive growth on OpenBB default rows gives NVDA FY2024 EPS growth of -31.6% while net income grew 581% (E_LIVE_R3)."
    rule_function: same_filing_pair
    sample_tested: {live: true, evidence: [E_LIVE_R3, E_UNIT], symbols: [NVDA, RIVN]}

  - metric: margins
    category: derived
    canonical_definition: "gross, operating, net (attributable to parent) and FCF margin: numerator / revenue."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "same period for numerator and revenue"
    direct_or_derived: derived
    inputs: [gross_profit, operating_income, net_income_attributable_to_parent, free_cash_flow, revenue]
    formula: "margin(numerator, revenue) = numerator / revenue"
    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "revenue == 0 -> ZERO_DENOMINATOR; revenue < 0 -> NOT_MEANINGFUL; a negative numerator gives a legitimate negative margin (RIVN gross margin -24.1% in FY2024)."
    restatement_behavior: "Same vintage."
    status: DERIVED
    fallback: "none"
    limitations: "Cross-company margins depend on each filer's cost classification."
    rule_function: margin
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [RIVN]}

  - metric: margin_change
    category: derived
    canonical_definition: "Change in a margin between comparable periods, in percentage points."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "ticker or cik"
    period: "year over year"
    direct_or_derived: derived
    inputs: [margins]
    formula: "margin_now - margin_prior (both OK)."
    missing_data_behavior: "Either non-OK -> that state."
    negative_data_behavior: "Margins can be negative; the difference stays defined."
    restatement_behavior: "Same vintage."
    status: DERIVED
    fallback: "none"
    limitations: "Percentage points, not percent."
    rule_function: margin_change
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [RIVN]}

  - metric: price_to_sales
    category: derived
    canonical_definition: "Issuer market cap divided by TTM revenue."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: cik
    period: "snapshot market cap / TTM revenue"
    direct_or_derived: derived
    inputs: [market_cap_issuer, revenue]
    formula: "market_cap / revenue_ttm"
    missing_data_behavior: "Either missing -> MISSING_INPUT."
    negative_data_behavior: "revenue_ttm <= 0 -> NOT_MEANINGFUL; zero -> ZERO_DENOMINATOR."
    restatement_behavior: "TTM from the latest vintage known as of the market-cap date."
    status: DERIVED
    fallback: "none"
    limitations: "Mixing a delayed market cap with a TTM that may be 3 months stale; record both dates."
    rule_function: price_to_sales
    sample_tested: {live: false, evidence: [E_UNIT], symbols: []}

  - metric: price_to_earnings
    category: derived
    canonical_definition: "Price divided by trailing diluted EPS."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "security_id"
    period: "price at as_of / TTM diluted EPS"
    direct_or_derived: derived
    inputs: [price_current_delayed, diluted_eps]
    formula: "price / eps_ttm, EPS = sum of four discrete quarterly diluted EPS or TTM net income to common / current shares."
    missing_data_behavior: "Missing -> MISSING_INPUT. BRK-B has no EPS: MISSING_INPUT."
    negative_data_behavior: "EPS <= 0 -> NOT_MEANINGFUL (loss-making: no P/E); never a negative P/E."
    restatement_behavior: "Per-share basis must match the price basis (split)."
    status: DERIVED
    fallback: "market_cap / net_income_attributable_to_parent (TTM)."
    limitations: "Multi-class EPS differs by class; use the class priced."
    rule_function: price_to_earnings
    sample_tested: {live: true, evidence: [E_UNIT, E_FIXTURE_LIVE], symbols: [RIVN]}

  - metric: comparability_year_over_year
    category: derived
    canonical_definition: "Whether two reporting periods may be compared year over year at all."
    source: "derived"
    provider: derived
    command: "derived"
    identifier: "period_start, period_end of each point"
    period: "pair of periods"
    direct_or_derived: derived
    inputs: []
    formula: "period_kind(start,end) of both must match and not be OTHER; period ends 350-380 days apart. QUARTER 84-98 days, FISCAL_YEAR 350-380 days (covers 52/53-week years), YTD kinds are never compared with discrete quarters."
    missing_data_behavior: "Missing period start for a duration fact -> treated as INSTANT: caller must pass starts."
    negative_data_behavior: "n/a"
    restatement_behavior: "n/a"
    status: DERIVED
    fallback: "none"
    limitations: "Cannot detect acquisitions, divestitures or accounting-standard changes: those need human review. Transition periods (10-KT) classify as OTHER and are NOT_COMPARABLE."
    rule_function: comparable_year_over_year
    sample_tested: {live: false, evidence: [E_UNIT], symbols: []}

